name: release
# Publish a release on GitHub (or push a tag like v3.0) and this builds the
# download zip, attaches it, and fills in the notes from CHANGELOG.md.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the zip and notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          git archive --format=zip --prefix=SC-Inventory-Tracker/ -o "SC-Inventory-Tracker-${VER}.zip" HEAD
          awk -v v="## ${VER}" 'index($0, v)==1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          printf '\n**Install:** download `SC-Inventory-Tracker-%s.zip` below, unzip it anywhere and double-click **Setup.bat**. Full instructions are in the README.\n' "$VER" >> notes.md
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP="SC-Inventory-Tracker-${VER}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            if [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" "$ZIP" --title "SC Inventory Tracker ${VER}" --notes-file notes.md
          fi
