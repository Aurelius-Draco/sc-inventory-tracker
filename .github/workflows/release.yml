name: release
# Push a tag like v3.0 and this builds the download zip and publishes the release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          git archive --format=zip --prefix=SC-Inventory-Tracker/ -o "SC-Inventory-Tracker-${VER}.zip" "$TAG"
          awk -v v="## ${VER}" 'index($0, v)==1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          printf '\n**Install:** download `SC-Inventory-Tracker-%s.zip` below, unzip it anywhere and double-click **Setup.bat**. Full instructions are in the README.\n' "$VER" >> notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "SC-Inventory-Tracker-${GITHUB_REF_NAME#v}.zip" --title "SC Inventory Tracker ${GITHUB_REF_NAME#v}" --notes-file notes.md
