name: Idea
description: Something that would make the tracker more useful
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like to do
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Links, sketches or examples from other tools. Crop the in-game QR code and other players' handles out of any screenshots.
