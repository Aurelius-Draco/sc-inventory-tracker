<style>
:root {

    --line: #dce0e5; --line2: #b6bec8; --text: #13171c; --muted: #4f5965;
    --amber: #8c5000; --on-amber: #ffffff; --teal: #0a6b5f; --rust: #a23a22; --fresh: #2c5a84;
    --amber-bg: rgba(140,80,0,.08); --amber-line: rgba(140,80,0,.5); --teal-bg: rgba(10,107,95,.08); --rust-bg: rgba(162,58,34,.08); --fresh-bg: rgba(44,90,132,.08);
    --hover: rgba(19,30,45,.045); --zebra: rgba(19,30,45,.022); --sel: rgba(140,80,0,.08); --sel-hover: rgba(140,80,0,.12);

  --line: #dce0e5; --line2: #b6bec8; --text: #13171c; --muted: #4f5965;
  --amber: #8c5000; --on-amber: #ffffff; --teal: #0a6b5f; --rust: #a23a22; --fresh: #2c5a84;
  --amber-bg: rgba(140,80,0,.08); --amber-line: rgba(140,80,0,.5); --teal-bg: rgba(10,107,95,.08); --rust-bg: rgba(162,58,34,.08); --fresh-bg: rgba(44,90,132,.08);

/* A sparse, static starfield. No animation, painted once. */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(circle at 37px 61px, var(--star) 0 .7px, transparent 1.3px) 0 0 / 460px 460px,
    radial-gradient(circle at 211px 143px, var(--star) 0 .6px, transparent 1.2px) 0 0 / 460px 460px,
    radial-gradient(circle at 389px 297px, var(--star) 0 .8px, transparent 1.4px) 0 0 / 460px 460px,
    radial-gradient(circle at 121px 402px, var(--star) 0 .5px, transparent 1.1px) 0 0 / 460px 460px,
    radial-gradient(circle at 300px 30px, var(--star) 0 .5px, transparent 1.1px) 0 0 / 460px 460px,
    radial-gradient(1100px 520px at 100% -12%, var(--fresh-bg), transparent 62%); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* Shared label style: condensed caps */
.sys h2, .cell dt, th, .blk > h3, .det > summary, .day h3, .grp > h4, .wr.wrh, .slot.slh, .orow.ohead, .eyebrow, .ghn, .tabbar button, .needs-h h3, .dh .eyebrow {
  font-stretch: semi-condensed; text-transform: uppercase; letter-spacing: .07em; }

/* Panels: thin precise border, small radius, no blur */
.frame { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--edge); }

/* Layout */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
main { width: 100%; max-width: 108rem; justify-self: start; padding: var(--s6) var(--s7) 5rem; min-width: 0; container-type: inline-size; }

/* Station rail */
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); scrollbar-width: thin; }
.brand { display: flex; gap: var(--s3); align-items: center; padding: var(--s5) var(--s5) var(--s4); border-bottom: 1px solid var(--line); }
.mark { flex: none; color: var(--amber); display: grid; }

.st:hover { background: var(--hover); }

.st[aria-current="true"]:hover { background: var(--sel-hover); }

.st .nm { font-size: .875rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.st .q { color: var(--muted); font-size: .8125rem; text-align: right; }
.st .fr { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--s2); font-size: .75rem; color: var(--muted); }
.st .fr.warn { color: var(--amber); }
.meter { display: inline-flex; gap: 2px; align-items: flex-end; flex: none; }
.meter i { width: 3px; background: var(--line2); }
.meter i:nth-child(1) { height: 4px; } .meter i:nth-child(2) { height: 6px; } .meter i:nth-child(3) { height: 8px; } .meter i:nth-child(4) { height: 10px; } .meter i:nth-child(5) { height: 12px; }
.meter i.on { background: var(--fresh); }
.meter.old i.on { background: var(--amber); }
.rail-foot { margin-top: auto; padding: var(--s3) var(--s5) var(--s4); border-top: 1px solid var(--line); font-size: .75rem; color: var(--muted); display: grid; gap: 2px; }
.live { display: flex; align-items: center; gap: var(--s2); }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
.live.lost { color: var(--amber); } .live.lost i { background: var(--amber); }
.railnote { padding: var(--s2) var(--s3); font-size: .8125rem; color: var(--muted); }

/* Search */
.search { display: flex; align-items: center; gap: var(--s3); height: 3rem; padding: 0 var(--s2) 0 var(--s4); background: var(--field); border: 1px solid var(--line2); border-radius: var(--r); transition: border-color .12s; }

.iconbtn:hover { color: var(--text); background: var(--hover); }

/* Needs you */
.needs { margin-top: var(--s4); border-color: var(--amber-line); box-shadow: inset 0 2px 0 var(--amber); }
.needs-h { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s3); padding: var(--s3) var(--s5); }
.needs-h h3 { margin: 0; font-size: .875rem; font-weight: 700; color: var(--amber); }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
.need { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: center; padding: var(--s3) var(--s5); border-top: 1px solid var(--line); }
.need p { margin: 0; flex: 1 1 20rem; }
.need .ctl { flex: 0 1 auto; display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.need select, .need .inp { height: var(--h-sm); min-height: 0; max-width: 100%; min-width: 0; }
.needs .more { padding: var(--s2) var(--s5) var(--s3); border-top: 1px solid var(--line); }

.head { margin-top: var(--s4); padding: var(--s5) var(--s6); display: grid; gap: var(--s4); overflow: hidden; background: linear-gradient(180deg, var(--raise), var(--panel) 70%); }
.head::before { content: ""; position: absolute; pointer-events: none; width: 44rem; height: 44rem; right: -14rem; top: 62%; border-radius: 50%;
  background: radial-gradient(circle at 50% 0%, var(--limb), transparent 42%); box-shadow: inset 0 1px 0 var(--limb-line); }
.head::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;

.head.sweep::after { animation: sweep .9s ease-out; }
@keyframes sweep { 0% { opacity: 1; background-position: -40% 0; } 100% { opacity: 1; background-position: 140% 0; } }
.hmain, .readout, .warns { position: relative; z-index: 1; }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); font-size: .6875rem; font-weight: 600; color: var(--muted); letter-spacing: .12em; }
.eyebrow .sysname { color: var(--amber); font-weight: 700; }
.hmain { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--s2) var(--s5); }
.hmain h2 { font-size: 1.875rem; font-weight: 700; font-stretch: condensed; margin: var(--s1) 0 0; line-height: 1.05; overflow-wrap: anywhere; }
.readout { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s7); margin: 0; }
.cell { min-width: 0; padding-left: var(--s3); border-left: 2px solid var(--line2); }
.cell.warn { border-left-color: var(--amber); } .cell.rust { border-left-color: var(--rust); }
.cell dt { font-size: .6875rem; font-weight: 600; color: var(--muted); }
.cell dd { margin: 2px 0 0; font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: var(--s2); white-space: nowrap; line-height: 1.3; }
.cell.warn dd { color: var(--amber); } .cell.rust dd { color: var(--rust); }
.cell .sub { white-space: normal; }
.warns { display: grid; gap: var(--s2); }
.notice { display: flex; gap: var(--s2); align-items: flex-start; margin: 0; padding: var(--s2) var(--s3); border: 1px solid var(--line2); border-left: 2px solid var(--amber); background: var(--raise); border-radius: var(--r-sm); font-size: .875rem; }
.notice > svg { flex: none; color: var(--amber); margin-top: 2px; }
.notice b { color: var(--amber); }
.notice.rust { border-left-color: var(--rust); } .notice.rust > svg, .notice.rust b { color: var(--rust); }
.rename { margin-top: var(--s3); padding: var(--s4) var(--s5); display: grid; gap: var(--s3); }
.rh { display: flex; justify-content: space-between; gap: var(--s3); align-items: flex-start; }
.rh h3 { margin: 0 0 2px; font-size: 1rem; }
.rh p { margin: 0; }
.placelist { max-height: 18rem; overflow-y: auto; border: 1px solid var(--line2); border-radius: var(--r-sm); max-width: 35rem; background: var(--field); }
.placelist button { display: flex; justify-content: space-between; gap: var(--s3); width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: var(--s2) var(--s3); }
.placelist button:last-child { border-bottom: 0; }
.placelist button:hover { background: var(--hover); }
.placelist button:focus-visible { outline-offset: -2px; }
.placelist button[aria-current="true"] { background: var(--sel); box-shadow: inset 2px 0 0 var(--amber); }

/* Tabs: opaque, sticky, one underline for the active one */
.tabbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: stretch; gap: 0; height: 3rem; margin: var(--s6) calc(-1 * var(--s7)) 0; padding: 0 calc(var(--s7) - var(--s3)); overflow-x: auto; scrollbar-width: none; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabbar::-webkit-scrollbar { display: none; }
.tabbar button { position: relative; flex: none; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3); background: none; border: 0; color: var(--muted); font-size: .9375rem; font-weight: 700; white-space: nowrap; }
.tabbar button:hover { color: var(--text); }
.tabbar button[aria-selected="true"] { color: var(--text); }
.tabbar button[aria-selected="true"]::after { content: ""; position: absolute; left: var(--s3); right: var(--s3); bottom: -1px; height: 2px; background: var(--amber); }
.tabbar button:focus-visible { outline-offset: -4px; }
.tabbar .t2 { margin-left: auto; }
.count { font-size: .6875rem; line-height: 1.125rem; min-width: 1.375rem; padding: 0 5px; text-align: center; border-radius: 2px; background: var(--raise2); color: var(--muted); font-weight: 700; letter-spacing: 0; }
.count.teal { color: var(--teal); } .count.rust { color: var(--rust); }
.count:empty { display: none; }

/* Filters: one control height */
.filters { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin: var(--s4) 0 0; }
label.sel { display: inline-flex; align-items: center; gap: var(--s2); font-size: .8125rem; color: var(--muted); }
select, .inp, .field input, .field textarea, textarea { background: var(--field); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 0 var(--s3); color: var(--text); height: var(--h); }
textarea, .field textarea { height: auto; padding: var(--s2) var(--s3); }
select { padding-right: var(--s1); }
select:hover, .inp:hover, .field input:hover, textarea:hover { border-color: var(--muted); }
select:focus, .inp:focus, .field input:focus, textarea:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.chipt { display: inline-flex; align-items: center; gap: var(--s2); height: var(--h); padding: 0 var(--s3) 0 var(--s2); border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--field); font-size: .8125rem; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
.chipt:hover { color: var(--text); border-color: var(--muted); }
.chipt input { appearance: none; -webkit-appearance: none; flex: none; width: 14px; height: 14px; margin: 0; border: 1.5px solid var(--line2); border-radius: 2px; background: var(--field); }
.chipt input:checked { background: var(--amber); border-color: var(--amber); box-shadow: inset 0 0 0 2px var(--field); }
.chipt input:focus { outline: none; }
.chipt:has(input:checked) { color: var(--text); border-color: var(--amber-line); }
.chipt:has(input:focus-visible) { outline: 2px solid var(--amber); outline-offset: 2px; }
.fend { margin-left: auto; display: flex; gap: var(--s3); align-items: center; font-size: .8125rem; color: var(--muted); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); height: var(--h); padding: 0 var(--s4); border: 1px solid var(--amber); border-radius: var(--r-sm); background: var(--amber); color: var(--on-amber); font-weight: 600; white-space: nowrap; transition: filter .12s, background-color .12s, border-color .12s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { filter: brightness(.94); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost { background: var(--raise); color: var(--text); border-color: var(--line2); }
.btn.ghost:hover { filter: none; background: var(--raise2); border-color: var(--muted); }
.btn.sm { height: var(--h-sm); padding: 0 var(--s3); font-size: .8125rem; }
.link { background: none; border: 0; padding: 2px 0; color: var(--teal); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-align: left; white-space: nowrap; }
.link:hover { color: var(--text); }
.link.danger { color: var(--rust); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line2); border-radius: var(--r-sm); overflow: hidden; background: var(--field); }
.seg button { height: var(--h-sm); background: none; border: 0; border-left: 1px solid var(--line2); padding: 0 var(--s3); color: var(--muted); font-weight: 600; font-size: .8125rem; }
.seg button:first-child { border-left: 0; }
.seg button:hover { color: var(--text); background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--raise2); color: var(--text); box-shadow: inset 0 -2px 0 var(--amber); }
.seg button:focus-visible { outline-offset: -3px; }

/* Tables */
.tablewrap { margin-top: var(--s3); }
.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .6875rem; font-weight: 700; color: var(--muted); padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line2); background: var(--thead); white-space: nowrap; }
th button { display: inline-flex; align-items: center; gap: var(--s1); background: none; border: 0; padding: 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; }
th button:hover, th[aria-sort] button { color: var(--text); }
th .arr { color: var(--amber); font-size: .625rem; }
td { padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tr.row { cursor: pointer; }
table.items { border-radius: var(--r); }
table.items thead th { position: sticky; top: var(--tabh, 3rem); z-index: 5; height: 2.375rem; padding-top: 0; padding-bottom: 0; color: var(--text); font-size: .75rem; border-bottom: 0; box-shadow: inset 0 -2px 0 var(--amber); }
table.items thead th:first-child { border-top-left-radius: var(--r); }
table.items thead th:last-child { border-top-right-radius: var(--r); }
table.items td { padding: 6px var(--s3); vertical-align: middle; border-bottom: 1px solid var(--line); }
table.items td:first-child, table.items th:first-child { padding-left: var(--s5); }
table.items td:last-child, table.items th:last-child { padding-right: var(--s5); }
table.items tr.row > td { background: transparent; }
table.items tr.row.alt > td { background: var(--zebra); }
table.items tr.row:hover > td { background: var(--hover); }
table.items tr.row.sel > td { background: var(--sel); }
table.items tr.row.sel:hover > td { background: var(--sel-hover); }
table.items tr.row.sel > td:first-child { box-shadow: inset 2px 0 0 var(--amber); }
.c-item { min-width: 14rem; width: 40%; }
.filters select { max-width: 13rem; }
.c-qty { width: 1%; white-space: nowrap; }
.c-qty .delta { margin: 0 var(--s2) 0 0; vertical-align: 1px; }
.c-val { width: 1%; min-width: 7.5rem; }
.val { font-weight: 600; }

/* Empty states */

/* Tips, links, settings, about */

.opt { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); gap: var(--s1) var(--s3); align-items: start; padding: var(--s3) 0; border-top: 1px solid var(--line); cursor: pointer; }

.switch { appearance: none; -webkit-appearance: none; position: relative; width: 2.25rem; height: 1.25rem; margin: 1px 0 0; border-radius: 2px; background: var(--line2); transition: background .12s; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: .875rem; height: .875rem; border-radius: 1px; background: var(--text); transition: left .12s; }
.switch:checked { background: var(--amber); } .switch:checked::after { left: calc(100% - .875rem - 3px); background: var(--on-amber); }
.switch:focus { outline: none; } .switch:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.savebar { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: center; padding-top: var(--s3); border-top: 1px solid var(--line); }
/* About */
.ahero { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s7); align-items: start; margin-top: var(--s4); padding: var(--s6) var(--s7); border-top: 2px solid var(--amber); overflow: hidden; }

.aport::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
.aport::after { bottom: 0; right: 0; border-left: 0; border-top: 0; }
.aport img { display: block; width: 200px; height: 200px; object-fit: cover; border-radius: 3px; border: 1px solid var(--line2); }
.abody { position: relative; z-index: 1; min-width: 0; }

Switch on one or more category filters (Armor, Weapons, Vehicles and so on) before you press Stack. The tracker sees which are on, scans just those, and slots the result into your last full scan. Use a whole category (All Categories in its menu), not part of one. Changing a filter mid-scan starts a fresh scan of the new selection."]}, {"head": "Scanning quickly", "items": ["Rest the mouse on each item for about half a second. A click sound and a green dot mean it's recorded.", "For a run of identical items, hover only the first and the last. Everything between is filled in (blue dot) because the kiosk sorts by name. It works across pages too.", "Amber outlines are tiles still to hover. Scroll each page to the bottom so the tracker sees every tile. Scrolling back and hovering again never double counts.", "Locked (expired) items still need a hover so the count comes out right. For a two-slot locked item, hover its left half.", "If a name comes out cut off, the tooltip was still appearing. Hold still a moment longer; the tracker has another look by itself. Press Insert to force a capture.", "Don't move items in or out, stack, or use the freight elevator while scanning. The list changes and the scan starts again."]}, {"head": "At shops", "items": ["At a shop terminal, press Insert and the overlay labels every item on screen that you already have in storage, with how many and where. Set it to automatic in Settings if you don't mind the extra CPU."]}, {"head": "Getting the exact total", "items": ["Open the freight elevator terminal, clear any filter or search, and scroll its list to the very bottom. The game logs the exact item count and the tracker uses it to confirm the scan is complete."]}, {"head": "Between scans", "items": ["Items you move in or out of station storage, and things you buy at shops, are picked up from the game's log automatically, even for sessions when the tracker wasn't running.", "The log can't see freight elevator moves or which commodity you sold. The dashboard flags those so you can fix them by hand or rescan.", "A fresh scan always replaces earlier edits for that station, because a scan shows what's really there.", "If Excel has a CSV file open, the tracker can't update it. Close it and it updates next time."]}], "links": [{"head": "Ship loadouts", "items": [{"name": "Erkul", "url": "https://www.erkul.games", "about": "Build, compare and share ship loadouts. Check the parts here before you buy."}, {"name": "SPViewer", "url": "https://www.spviewer.eu", "about": "Ship performance and loadout comparisons."}, {"name": "Star Citizen Armory", "url": "https://armory.thespacecoder.space", "about": "Plan a personal (FPS) loadout and get a shopping list."}]}, {"head": "Prices, trading and hauling", "items": [{"name": "UEX", "url": "https://uexcorp.space", "about": "Commodity and item prices reported by players, trade and mining routes."}, {"name": "SC Trade Tools", "url": "https://sc-trade.tools", "about": "Trade and mining routes, commodity prices, refinery yields."}, {"name": "SC Hauling Tools", "url": "https://sc-hauling.tools", "about": "Stop and delivery order for hauling contracts."}]}, {"head": "Finding items, missions and crafting", "items": [{"name": "Cornerstone Item Finder", "url": "https://finder.cstone.space", "about": "Where to buy personal and ship equipment, with stats."}, {"name": "SC Mission Database", "url": "https://scmdb.net", "about": "Missions, crafting blueprints, resources and mining."}, {"name": "Star Citizen Wiki API", "url": "https://star-citizen.wiki", "about": "Item data this tracker uses for stats and prices."}]}, {"head": "Maps and places", "items": [{"name": "VerseGuide", "url": "https://verseguide.com", "about": "Find locations in the verse."}, {"name": "Star Citizen Maps", "url": "https://maps.adi.sc", "about": "3D ship interiors with points of interest."}]}, {"head": "Wikis and lists", "items": [{"name": "Star Citizen Tools wiki", "url": "https://starcitizen.tools", "about": "Community wiki, including a big list of community tools."}, {"name": "Roberts Space Industries", "url": "https://robertsspaceindustries.com", "about": "The official site, Spectrum forums and patch notes."}]}], "about": {"author": {"name": "Aurelius_Draco", "handle": "", "org": "", "repo": ""}, "message": ["I built this to keep track of what I'd left at stations around the verse, and it turned out useful enough to share. It's free and always will be.", "The only thing I ask in return: if you see me in game or in chat, say hi, and if you're running team gameplay, invite me along."], "rules": ["It only reads your screen, Game.log and the game's text file. It never touches the game's memory or network traffic, and never sends mouse or keyboard input.", "Nothing about you leaves your PC. The only network use is fetching public item data and prices from api.star-citizen.wiki, by item id, and you can turn that off in Settings.", "The dashboard only answers this PC (127.0.0.1).", "Not affiliated with or endorsed by Cloud Imperium Games. Star Citizen is a trademark of Cloud Imperium Rights LLC."], "version": "3.0"}, "settings": {"overlay": true, "sound": true, "track_from_log": true, "fetch_item_data": true, "summary_hide_types": ["Magazine", "Battery"], "dashboard_with_live": true, "shop_helper": "key"}, "places": ["Keeger Social Station 001", "Nyx", "People's Service Station Alpha", "SERVICE STATION", "People's Service Station Delta", "People's Service Station Theta", "People's Service Station Lambda", "People's Service Station Omicron", "Glaciem Social Station 001", "STATION ID:", "Starlight Service Station", "Ruin Station", "Keeger Belt", "MINING STATION", "Seraphim Station", "Cry-Astro Service", "Cry-Astro Service 042", "Cry-Astro Service 151", "Cry-Astro Service 262", "Cry-Astro Service 370", "Cry-Astro Service 404", "Cry-Astro Service 501", "Cry-Astro Service 685", "Cry-Astro Service 793", "Cry-Astro Service 824", "ARC-L4 Faint Glen Station", "Nyx Gateway", "ARC-L1 Wide F /* ---------- stations ---------- */
const freshLevel = (age) => age == null ? 0 : age < 1 ? 5 : age < 3 ? 4 : age < 7 ? 3 : age < 14 ? 2 : 1;

function stationNote(s) {

  if (sc.before_patch) return { warn: true, text: "Scanned before the last patch" };
  if (s.untracked_changes) return { warn: true, text: "Changed outside the log, rescan" };
  if (sc.repeat_warning) return { warn: true, text: "Kiosk listed items twice, rescan" };
  if (!sc.complete) return { warn: true, text: "Scan not finished" };

}
function systems() {
  const by = {};
  for (const s of S.model.stations) (by[s.system || "Other"] ||= []).push(s);
  const rank = (k) => { const i = SYS_ORDER.indexOf(k); return i < 0 ? 99 : i; };
  return Object.entries(by).sort((a, b) => rank(a[0]) - rank(b[0]) || a[0].localeCompare(b[0]));
}
function renderRail() {

/* ---------- filters ---------- */
const SORTS = {
  name: [(a, b) => a.name.localeCompare(b.name), 1],
  qty: [(a, b) => S.tab === "expired" ? a.expired - b.expired : a.qty - b.qty, -1],
  value: [(a, b) => (a.value || 0) - (b.value || 0), -1],
  changed: [(a, b) => (a.last_change || 0) - (b.last_change || 0), -1],
  station: [(a, b) => (a.location || "").localeCompare(b.location || "") || a.name.localeCompare(b.name), 1],
  type: [(a, b) => (a.item_type || "\uffff").localeCompare(b.item_type || "\uffff") || a.name.localeCompare(b.name), 1]
};
function filtered(station = S.station, bare = false) {
  const q = $("q").value.trim().toLowerCase(), type = $("ftype").value;
  let rows = S.model.items.filter(i => !station || i.location_key === station);
  if (S.tab === "expired") rows = rows.filter(i => i.expired > 0);
  else rows = rows.filter(i => i.qty > 0 || i.changed);
  if (bare) return rows;
  if ($("fammo").checked && S.tab !== "expired") rows = rows.filter(i => !HIDE_AMMO.test(i.item_type || ""));
  if (type) rows = rows.filter(i => (i.item_type || "Unknown") === type);
  if ($("fchanged").checked) rows = rows.filter(i => i.changed);
  if ($("freg").checked) rows = rows.filter(i => i.registered > 0);
  if ($("fspread").checked) rows = rows.filter(i => i.also_at.length);
  if (q) rows = rows.filter(i => [i.name, i.manufacturer, i.item_type, i.item_class, i.location, i.note, ...(i.tags || [])]
      .some(v => (v || "").toLowerCase().includes(q)));
  const [by, d] = SORTS[S.sort] || SORTS.name;
  return rows.sort((a, b) => by(a, b) * d * S.dir || a.name.localeCompare(b.name));
}
const filtersActive = () => !!($("q").value.trim() || $("ftype").value || $("fchanged").checked || $("freg").checked || $("fspread").checked);
function clearFilters() {

}
function fillTypes() {

  for (const i of S.model.items) if ((!S.station || i.location_key === S.station) && i.qty > 0) { const t = i.item_type || "Unknown"; n[t] = (n[t] || 0) + 1; }
  const types = Object.keys(n).sort();

  sel.innerHTML = `<option value="">Any</option>` + types.map(t => `<option value="${esc(t)}" ${t === cur ? "selected" : ""}>${esc(t)} (${n[t]})</option>`).join("");
}

function itemSearch(el, onPick, endpoint = "/api/suggest") {
  const box = document.createElement("div"); box.className = "sugg"; box.id = el.id + "-list"; box.setAttribute("role", "listbox"); box.hidden = true; el.after(box);
  el.setAttribute("role", "combobox"); el.setAttribute("aria-autocomplete", "list"); el.setAttribute("aria-expanded", "false"); el.setAttribute("aria-controls", box.id);
  let t = null, rows = [], act = -1, seq = 0;
  const show = (on) => { box.hidden = !on; el.setAttribute("aria-expanded", on); };
  const draw = () => {
    box.innerHTML = rows.map((r, k) => `<div role="option" id="${box.id}-${k}" data-k="${k}" aria-selected="${k === act}"><span>${esc(r.name)}</span>
      <span class="sub">${r.have ? `you have ${fmt(r.have)}` : (r.maker ? esc(r.maker) + (r.role ? ", " + esc(r.role) : "") : "")}</span></div>`).join("");
    if (act >= 0) { el.setAttribute("aria-activedescendant", `${box.id}-${act}`); const o = $(`${box.id}-${act}`); if (o) { const top = o.offsetTop, bot = top + o.offsetHeight; if (top < box.scrollTop) box.scrollTop = top; else if (bot > box.scrollTop + box.clientHeight) box.scrollTop = bot - box.clientHeight; } }
    else el.removeAttribute("aria-activedescendant");
    show(rows.length > 0);
  };
  const pick = (k) => { const r = rows[k]; if (!r) return; el.value = r.name; rows = []; act = -1; draw(); onPick(r); };
  el.addEventListener("input", () => {
    clearTimeout(t);
    const q = el.value.trim();
    if (q.length < 2) { rows = []; act = -1; draw(); return; }
    t = setTimeout(async () => {
      const my = ++seq; let r;
      try { r = await api(`${endpoint}?q=${encodeURIComponent(q)}`); } catch (e) { return; }
      if (my !== seq) return;
      rows = r || []; act = -1; draw();
      if (!rows.length) { box.innerHTML = `<div class="none">No matches for \u201c${esc(q)}\u201d. Try fewer letters or another part of the name.</div>`; show(true); }
    }, 180);
  });
  el.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" && rows.length) { e.preventDefault(); act = (act + 1) % rows.length; draw(); }
    else if (e.key === "ArrowUp" && rows.length) { e.preventDefault(); act = (act - 1 + rows.length) % rows.length; draw(); }
    else if (e.key === "Enter" && rows.length && !box.hidden) { e.preventDefault(); pick(act >= 0 ? act : 0); }
    else if (e.key === "Escape" && !box.hidden) { e.preventDefault(); show(false); }
  });
  box.addEventListener("mousedown", e => e.preventDefault());
  box.addEventListener("click", e => { const o = e.target.closest("[role=option]"); if (o) pick(+o.dataset.k); });
  el.addEventListener("blur", () => setTimeout(() => show(false), 120));
}

  if (h.events && h.events.length) R.push(route("Events", "", `<p>${h.events.map(e => esc(e.name || e)).join(", ")}</p>`));
  out += `<div class="routes">${R.join("")}</div>`;
  const sell = (h.sell || []).slice().sort((a, b) => b.sell - a.sell);
  if (sell.length) out += `<p class="sub">Sells for up to <b>${fmt(sell[0].sell)} aUEC</b> at ${esc(sell[0].terminal || sell[0].place)}.</p>`;
  if (h.url) out += `<p class="sub"><a href="${esc(h.url)}" target="_blank" rel="noopener">More on star-citizen.wiki ${ICON.ext}</a></p>`;
  return out + `</div>`;
}

      if (open) fill(x);

}

  V.querySelectorAll("[data-stock]").forEach(b => b.onclick = () => {

  V.querySelectorAll("[data-want]").forEach(c => c.onchange = () => S.want[c.dataset.want] = c.checked);

function renderShipsLocal(key, b) {

      <label class="sw num"><input type="checkbox" data-want="${key}" ${want ? "checked" : ""}><span class="sm-only">Want</span><span class="sr"> ${esc(g.fitted.name || g.label)} on the wish list</span></label></div>

  };
  return `<section class="frame ship" aria-label="${esc(s.nickname || s.name)}"><div class="shiph">

    <div id="ship-${s.id}" ${open ? "" : "hidden"}>

      `<div class="slot slh" aria-hidden="true"><span>Part</span><span>Size</span><span>Fitted</span><span class="num">In storage</span><span></span><span class="num">Want</span></div>` +
      cats.map(([label, list]) => `<div class="grp"><h4>${label}</h4>${list.map(([g, k]) => slot(g, k)).join("")}</div>`).join("") +
      `<div class="shipfoot"><button class="btn ghost" type="button" data-swish="${s.id}">Add ticked parts to wish list</button><span class="sub">They go on a list called \u201c${esc(s.nickname || s.name)}\u201d.</span></div>`}
    </div></section>`;
}
async function drawOpts(key) {
  const [sid, k] = key.split(":"), s = S.ships.ships.find(x => x.id === +sid); if (!s) return;

    try { S.optCache[ck] = await api(`/api/options?type=${encodeURIComponent(g.item_type)}&size=${g.size}`); }
    catch (e) { cell.innerHTML = `<p class="sub">Couldn't load the options. ${esc(problem(e))}</p>`; return; }
  }
  const opts = S.optCache[ck];
  if (!opts.length) { cell.innerHTML = `<p class="sub">There are no size ${esc(g.size)} ${esc(g.label.toLowerCase())} options in the item data yet.</p>`; return; }
  const main = { Cooler: "coolant", PowerPlant: "power", Shield: "shield_hp" }[g.item_type];
  const mainLabel = { coolant: "Cooling", power: "Power", shield_hp: "Shield health" }[main];
  const fid = (g.fitted.id || "").toLowerCase(), sidd = ((g.stock && g.stock.id) || "").toLowerCase();
  const classes = [...new Set(opts.map(o => o.item_class).filter(Boolean))].sort();
  if (st.cls && !classes.includes(st.cls)) st.cls = "";
  const big = (v) => v == null ? -Infinity : v, small = (v) => v == null ? Infinity : v;
  const sorts = {
    best: (a, b) => (b.have - a.have) || (main ? big(b.stats[main]) - big(a.stats[main]) : 0) || (a.grade || "Z").localeCompare(b.grade || "Z") || a.name.localeCompare(b.name),
    main: (a, b) => big(b.stats[main]) - big(a.stats[main]),
    ir: (a, b) => small(a.stats.ir) - small(b.stats.ir),
    em: (a, b) => small(a.stats.em) - small(b.stats.em),
    price: (a, b) => small(a.cheapest) - small(b.cheapest),
    grade: (a, b) => (a.grade || "Z").localeCompare(b.grade || "Z") || a.name.localeCompare(b.name)
  };
  if (st.sort === "main" && !main) st.sort = "best";
  const list = opts.filter(o => (!st.cls || o.item_class === st.cls) && (!st.mine || o.have > 0) && (!st.sale || o.cheapest)).sort(sorts[st.sort]);
  const max = main ? Math.max(1, ...opts.map(o => o.stats[main] || 0)) : 1;
  const shown = st.all ? list : list.filter((o, j) => j < 8 || o.id === fid);
  const rows = shown.map(o => {
    const j = opts.indexOf(o), here = o.id === fid, isStock = o.id === sidd;
    const howOpen = st.how === o.id, hk = `${o.id}|${o.name}`;
    return `<div class="orow${here ? " this" : ""}"><div class="on"><b>${esc(o.name)}</b><div class="meta">${here ? `<span class="chip edit">Fitted now</span>` : ""}${isStock ? `<span class="chip tag">Stock</span>` : ""}<span class="sub">${esc(o.maker || "")}</span><button class="link" type="button" data-ohow="${j}" aria-expanded="${howOpen}">${howOpen ? "Hide how to get it" : "How to get it"}</button></div></div>
      <div><span class="sm-lbl">Grade and class</span>${esc(o.grade || "")} <span class="sub">${esc(o.item_class || "")}</span></div>
      ${main ? `<div class="num"><span class="sm-lbl">${mainLabel}</span>${fmt(o.stats[main])}<span class="bar" aria-hidden="true"><i style="width:${Math.round((o.stats[main] || 0) / max * 100)}%"></i></span></div>` : ""}
      <div class="num"><span class="sm-lbl">IR</span>${fmt(o.stats.ir)}</div><div class="num"><span class="sm-lbl">EM</span>${fmt(o.stats.em)}</div>
      <div class="num"><span class="sm-lbl">Cheapest</span>${o.cheapest ? fmt(o.cheapest) : `<span class="sub">Not sold</span>`}</div>

      <div class="acts">${here ? "" : `<button class="btn ghost sm" type="button" data-fit="${j}">Plan this fit<span class="sr"> (${esc(o.name)})</span></button>`}</div></div>
      ${howOpen ? `<div class="ohow">${S.howCache[hk] ? `<h4 style="margin:0 0 8px">${esc(o.name)}</h4>` + howtoHtml(S.howCache[hk]) : `<p class="sub">Looking it up...</p>`}</div>` : ""}`;
  }).join("");
  cell.innerHTML = `<div class="opth"><h4>Size ${esc(g.size)} ${esc(g.label.toLowerCase())} options <span class="sub">${list.length === opts.length ? fmt(opts.length) : `${fmt(list.length)} of ${fmt(opts.length)}`}</span></h4>

      <label class="chipt"><input type="checkbox" data-omine ${st.mine ? "checked" : ""}> In my storage</label>
      <label class="chipt"><input type="checkbox" data-osale ${st.sale ? "checked" : ""}> Sold in shops</label>
      <label class="sel">Sort <select data-osort>${[["best", "Best match"], ...(main ? [["main", `Most ${mainLabel.toLowerCase()}`]] : []), ["ir", "Lowest IR"], ["em", "Lowest EM"], ["price", "Cheapest"], ["grade", "Grade"]].map(([v, l]) => `<option value="${v}" ${st.sort === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    </div></div>
    ${list.length ? `<div class="olist${main ? " has-main" : ""}"><div class="orow ohead" aria-hidden="true"><span>Option</span><span>Grade and class</span>${main ? `<span class="num">${mainLabel}</span>` : ""}<span class="num">IR</span><span class="num">EM</span><span class="num">Cheapest</span><span class="num">You have</span><span></span></div>${rows}</div>`

    ${list.length > shown.length || (st.all && list.length > 8) ? `<p style="margin:10px 0 0"><button class="link" type="button" data-oall>${st.all ? "Show the top 8 only" : `Show all ${list.length} options`}</button></p>` : ""}
    <p class="sub" style="margin:10px 0 0">Stealth parts run quieter (lower IR and EM, so you're harder to spot), Military ones are tougher, Competition ones push output. "Plan this fit" records your plan for this ship. It doesn't change the game.</p>`;
  const redraw = () => drawOpts(key);
  cell.querySelectorAll("[data-ocls]").forEach(b => b.onclick = () => { st.cls = b.dataset.ocls; redraw().then(() => { const x = cell.querySelector(`[data-ocls="${CSS.escape(st.cls)}"]`); if (x) x.focus(); }); });

  t("[data-omine]", el => st.mine = el.checked); t("[data-osale]", el => st.sale = el.checked); t("[data-osort]", el => st.sort = el.value);
  const all = cell.querySelector("[data-oall]"); if (all) all.onclick = () => { st.all = !st.all; redraw().then(() => { const x = cell.querySelector("[data-oall]"); if (x) x.focus(); }); };
  const rs = cell.querySelector("[data-oreset]"); if (rs) rs.onclick = () => { st.cls = ""; st.mine = false; st.sale = false; redraw(); };
  cell.querySelectorAll("[data-fit]").forEach(x => x.onclick = () => { const o = opts[+x.dataset.fit]; st.open = false;
    post("/api/ship_fit", { ship_id: +sid, slots: g.slots, item_id: o.id, item_name: o.name }); });
  cell.querySelectorAll("[data-ohow]").forEach(x => x.onclick = async () => {
    const o = opts[+x.dataset.ohow];
    st.how = st.how === o.id ? null : o.id; await redraw();
    const focusBack = () => { const y = cell.querySelector(`[data-ohow="${x.dataset.ohow}"]`); if (y) y.focus(); };
    focusBack();
    if (st.how === o.id && !S.howCache[`${o.id}|${o.name}`]) { try { await fetchHow(o.id, o.name); } catch (e) { toast(problem(e), true); } await redraw(); focusBack(); }
  });
}

/* ---------- item panel ---------- */
function drawerHtml(i) {
  const hist = S.model.changes.filter(c => c.location_key === i.location_key && c.item === i.name).slice().sort((a, b) => b.ts - a.ts);
  const parts = [i.scanned_qty != null ? `${fmt(i.scanned_qty)} at the last scan` : "Not in the last scan",
    i.log_change ? `${signed(i.log_change)} from the game log` : "",
    i.your_change ? `${signed(i.your_change)} recorded by you` : ""].filter(Boolean).join(", ");
  const spec = [i.item_type, i.size && `Size ${i.size}`, i.grade && `Grade ${i.grade}`, i.item_class].filter(Boolean).join(" \u00b7 ");
  const det = [["Type", i.item_type], ["Maker", i.manufacturer], ["Size", i.size], ["Grade", i.grade], ["Class", i.item_class],
    ["Registered to you", i.registered ? fmt(i.registered) : ""], ["Expired", i.expired ? fmt(i.expired) : ""],
    ["Tiles in kiosk", i.tiles || ""], ["Craftable", i.craftable ? "Yes" : ""], ["Item id", i.id ? `<code>${esc(i.id)}</code>` : ""]].filter(x => x[1]);
  const stats = i.stats ? Object.entries({ coolant: "Coolant output", power: "Power output", power_use: "Power draw",
    ir: "IR signature", em: "EM signature", health: "Health", shield_hp: "Shield health", mass: "Mass" })
    .filter(([k]) => i.stats[k] != null).map(([k, l]) => [l, fmt(i.stats[k])]) : [];
  const sell = (i.sell_spots || []).slice().sort((a, b) => b.sell - a.sell), buy = (i.buy_spots || []).slice().sort((a, b) => a.buy - b.buy);
  let cmp = "";
  if (i.compare && i.compare.rows.length) {
    const rows = i.compare.rows, max = Math.max(1, ...rows.map(r => r.main || 0));
    const top = rows.filter((r, k) => k < 8 || r.this), rest = rows.filter(r => !top.includes(r)), id = "cmpmore";
    const tr = r => `<tr class="${r.this ? "this" : ""}"><td>${esc(r.name)}${r.this ? " (this one)" : ""}</td><td>${esc(r.grade)}</td><td>${esc(r.item_class)}</td>
      <td class="num">${fmt(r.main)}<span class="bar" aria-hidden="true"><i style="width:${Math.round((r.main || 0) / max * 100)}%"></i></span></td><td class="num">${fmt(r.ir)}</td><td class="num">${r.cheapest ? fmt(r.cheapest) : ""}</td></tr>`;
    cmp = `<div class="blk"><h3>Other size ${esc(i.size)} ${esc((i.item_type || "part").toLowerCase())}s <span>${rows.length} in total</span></h3>
      <div class="tscroll"><table class="cmp"><thead><tr><th>Name</th><th>Grade</th><th>Class</th><th class="num">${esc(i.compare.label)}</th><th class="num">IR</th><th class="num">Cheapest</th></tr></thead>
      <tbody>${top.map(tr).join("")}</tbody>${rest.length ? `<tbody id="${id}" hidden>${rest.map(tr).join("")}</tbody>` : ""}</table></div>
      ${rest.length ? `<button class="link" type="button" data-more="${id}" aria-expanded="false" aria-controls="${id}" style="margin-top:8px">Show ${rest.length} more</button>` : ""}
      <p class="sub">Higher output isn't always better. Stealth parts run quieter (lower IR and EM), Military ones are tougher, Competition ones push output. Pick for the job.</p></div>`;
  }
  const also = i.also_at.map(n => `<button class="link" type="button" data-also="${esc(n)}">${esc(n)}</button>`).join(", ");
  return `<div class="dh"><div class="eyebrow">${esc(spec || "Item")}</div><h2 id="dtitle" tabindex="-1">${esc(i.name)}</h2>
      <div class="sub">${esc(i.location)}${i.system ? `, ${esc(i.system)}` : ""}</div>
      <button class="iconbtn close" type="button" id="dclose" aria-label="Close item panel" title="Close (Esc)">${ICON.x}</button></div>
    <div class="db">
      <div class="blk"><div class="big"><b>${fmt(i.qty)}</b><span>here now</span></div>
        <p class="sub">${esc(parts)}</p>
        ${i.registered || i.expired || i.tags.length ? `<div class="meta">${i.registered ? `<span class="chip reg">${fmt(i.registered)} registered to you</span>` : ""}${i.expired ? `<span class="chip exp">${fmt(i.expired)} expired</span>` : ""}${(i.tags || []).map(t => `<span class="chip tag">${esc(t)}</span>`).join("")}</div>` : ""}
        ${i.value ? `<p>Worth about <b>${fmt(i.value)} aUEC</b>${i.unit_sell ? ` <span class="sub">(${fmt(i.unit_sell)} each, best reported price)</span>` : ""}</p>` : ""}
        ${also ? `<p class="sub">Also at ${also}</p>` : ""}</div>
      <div class="blk"><h3>Record a change</h3>
        <div class="seg" role="group" aria-label="What happened"><button type="button" data-dir="-1" aria-pressed="true">Took out or sold</button><button type="button" data-dir="1" aria-pressed="false">Put in or found</button></div>
        <div class="form"><div class="field n"><label for="adq">How many</label><input type="number" id="adq" min="1" step="1" inputmode="numeric" placeholder="40"></div>
          <div class="field grow"><label for="adn">What happened (optional)</label><input id="adn" placeholder="e.g. sold at Levski"></div>
          <button class="btn" type="button" id="adgo">Record change</button></div>
        <p class="sub" id="adprev">The next scan of this station replaces it with the kiosk's own count.</p></div>
      ${hist.length ? `<div class="blk"><h3>Changes since the scan</h3><ul class="hist">${hist.map(c => `<li><span>${when(c.ts)}: <b class="${c.delta > 0 ? "have-n" : ""}" style="${c.delta < 0 ? "color:var(--rust)" : ""}">${signed(c.delta)}</b>, ${esc(c.what)}</span>
         ${c.adjustment_id ? `<button class="link" type="button" data-undo="${c.adjustment_id}">Undo</button>` : `<span class="chip log">Game log</span>`}</li>`).join("")}</ul></div>` : ""}
      ${sell.length ? `<div class="blk"><h3>Best places to sell <span>price each</span></h3>${spotList(sell, "sell")}</div>` : ""}
      ${buy.length ? `<div class="blk"><h3>Cheapest places to buy <span>price each</span></h3>${spotList(buy, "buy")}</div>` : ""}
      <div class="blk"><h3>Your note and tags</h3><p class="sub" style="margin:0">Shared by every stack of this item, at every station.</p>
        <div class="form"><div class="field" style="flex:1 1 100%"><label for="nt">Note</label><textarea id="nt" placeholder="e.g. keep for the Centaurus refit">${esc(i.note)}</textarea></div>
          <div class="field grow"><label for="tg">Tags, separated by commas</label><input id="tg" placeholder="keep, sell, mission" value="${esc((i.tags || []).join(", "))}"></div>
          <button class="btn ghost" type="button" id="ntgo">Save note and tags</button></div></div>
      ${stats.length ? `<div class="blk"><h3>Stats</h3><dl class="kv">${stats.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div>` : ""}
      ${cmp}
      ${det.length ? `<details class="blk det"><summary>More details</summary><dl class="kv">${det.map(([k, v]) => `<dt>${k}</dt><dd>${k === "Item id" ? v : esc(v)}</dd>`).join("")}</dl></details>` : ""}
      ${i.wiki_url ? `<div class="blk"><a href="${esc(i.wiki_url)}" target="_blank" rel="noopener">More on star-citizen.wiki ${ICON.ext}</a></div>` : ""}
    </div>`;
}
function openItem(i, fk, quiet) {
  if (!i) return;
  S.open = { key: i.location_key, name: i.name };
  if (fk) S.opener = fk;
  const d = $("drawer"), keep = d.scrollTop;
  d.innerHTML = drawerHtml(i);
  d.classList.add("open"); d.removeAttribute("inert");
  $("shell").classList.add("has-panel"); updateModal();
  document.querySelectorAll("#view tr.row").forEach(tr => { const r = S.rows[+tr.dataset.i]; tr.classList.toggle("sel", !!r && r.location_key === i.location_key && r.name === i.name); });
  $("dclose").onclick = () => closeItem();
  let dir = -1;
  const def = "The next scan of this station replaces it with the kiosk's own count.";
  const delta = () => { const raw = $("adq").value.trim(), n = parseInt(raw, 10); if (!n) return 0; return /^[+-]/.test(raw) ? n : dir * Math.abs(n); };
  const prev = () => {
    const dl = delta(), p = $("adprev");
    if (!dl) { p.textContent = def; return; }
    const nt = i.qty + dl;
    p.innerHTML = nt < 0 ? `<span class="warnt">That's more than the ${fmt(i.qty)} recorded here.</span> Check the number, or rescan this station.` : `New total here: <b>${fmt(nt)}</b>. ${def}`;
  };
  d.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => { dir = +b.dataset.dir; d.querySelectorAll("[data-dir]").forEach(x => x.setAttribute("aria-pressed", x === b)); prev(); });
  $("adq").oninput = prev;
  const go = async () => {
    const q = delta();
    if (!q) { $("adq").focus(); return toast("Enter how many, e.g. 40."); }
    if (await post("/api/adjust", { location_key: i.location_key, name: i.name, id: i.id, delta: q, note: $("adn").value })) reopen();
  };
  $("adgo").onclick = go;
  [$("adq"), $("adn")].forEach(el => el.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); go(); } });
  $("ntgo").onclick = async () => {
    if (await post("/api/note", { name: i.name, note: $("nt").value, tags: $("tg").value.split(",").map(t => t.trim()).filter(Boolean) })) reopen();
  };
  d.querySelectorAll("[data-undo]").forEach(b => b.onclick = async () => { if (await post("/api/undo", { adjustment_id: +b.dataset.undo })) reopen(); });
  d.querySelectorAll("[data-also]").forEach(b => b.onclick = () => {
    const st = S.model.stations.find(s => s.name === b.dataset.also); if (!st) return;
    const it = S.model.items.find(x => x.location_key === st.key && x.name === i.name);
    S.station = st.key; closeRename(false); render(); if (it) openItem(it, `item:${it.location_key}|${it.name}`);
  });
  bindMore(d);
  if (quiet) d.scrollTop = keep; else { d.scrollTop = 0; $("dtitle").focus(); }
}
function reopen() {
  if (!S.open) return;
  const i = S.model.items.find(x => x.location_key === S.open.key && x.name === S.open.name);
  if (i) openItem(i); else closeItem();
}
function refreshOpen() {
  const i = S.model.items.find(x => x.location_key === S.open.key && x.name === S.open.name);
  if (i) openItem(i, null, true);
}
function closeItem(focus = true) {
  if (!S.open) return;
  S.open = null;
  const d = $("drawer"); d.classList.remove("open"); d.setAttribute("inert", "");
  $("shell").classList.remove("has-panel"); updateModal();
  document.querySelectorAll("#view tr.row.sel").forEach(tr => tr.classList.remove("sel"));
  if (focus && S.opener) { const el = document.querySelector(`[data-fk="${CSS.escape(S.opener)}"]`); if (el) el.focus(); }
}
function updateModal() {
  const overlay = !!S.open && !dockMQ.matches, d = $("drawer");
  document.querySelector(".rail").inert = overlay; $("main").inert = overlay;
  $("scrim").classList.toggle("show", overlay);
  if (overlay) { d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true"); }
  else { d.setAttribute("role", "complementary"); d.removeAttribute("aria-modal"); }
}

/* ---------- wiring ---------- */
function render(auto) {
  if (!S.model) return;
  const ae = document.activeElement, fk = ae && ae.dataset ? ae.dataset.fk : null;
  renderRail(); fillTypes(); renderHead(); renderNeeds(); renderTabs();
  const t = S.tab;
  if (!(auto && ["wish", "ships", "settings", "tips", "links", "about"].includes(t))) {
    const tok = ++S.viewTok;
    const fail = e => { if (tok === S.viewTok) $("view").innerHTML = emptyState("Couldn't load this tab", `${esc(problem(e))}`, `<button class="btn ghost" type="button" data-retry>Try again</button>`); };
    try {
      if (t === "items" || t === "expired") renderItems();
      else if (t === "changes") renderChanges();
      else if (t === "wish") renderWish();
      else {
        const f = { tips: renderTips, ships: renderShips, links: renderLinks, about: renderAbout, settings: renderSettings }[t];
        if (f) f(tok).catch(fail);
      }
    } catch (e) { fail(e); }
  }
  if (fk) { const el = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }
}
$("rail").addEventListener("click", e => {
  const b = e.target.closest(".st"); if (!b) return;
  S.station = b.dataset.st; closeRename(false); closeItem(false); render();
});
$("tabs").addEventListener("click", e => { const b = e.target.closest("[role=tab]"); if (b) setTab(b.dataset.tab); });
$("tabs").addEventListener("keydown", e => {
  const tabs = [...$("tabs").querySelectorAll("[role=tab]")], i = tabs.indexOf(document.activeElement); if (i < 0) return;
  const n = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i - 1 + tabs.length) % tabs.length, Home: 0, End: tabs.length - 1 }[e.key];
  if (n != null) { e.preventDefault(); setTab(tabs[n].dataset.tab, true); tabs[n].focus(); }
});
$("view").addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return setTab(g.dataset.go);
  if (e.target.closest("[data-retry]")) return render();
  if (e.target.closest("[data-clear]")) { clearFilters(); $("q").focus(); return; }
  if (e.target.closest("[data-allst]")) { S.station = ""; render(); return; }
  const so = e.target.closest("[data-sort]");
  if (so) { const k = so.dataset.sort; if (S.sort === k) S.dir *= -1; else { S.sort = k; S.dir = 1; } $("fsort").value = k; render(); const b = $("view").querySelector(`[data-sort="${k}"]`); if (b) b.focus(); return; }
  const un = e.target.closest("[data-undo]"); if (un) return post("/api/undo", { adjustment_id: +un.dataset.undo });
  const co = e.target.closest("[data-chopen]");
  if (co) { const c = S.chRows[+co.dataset.chopen], it = S.model.items.find(i => i.location_key === c.location_key && i.name === c.item); if (it) { co.dataset.fk = `chg:${co.dataset.chopen}`; openItem(it, co.dataset.fk); } return; }
  const row = e.target.closest("tr.row");
  if (row && (!e.target.closest("button, a, input") || e.target.closest(".iname"))) { const it = S.rows[+row.dataset.i]; openItem(it, `item:${it.location_key}|${it.name}`); }
});
["ftype", "fchanged", "freg", "fspread", "fammo"].forEach(id => $(id).addEventListener("input", () => render()));
$("fsort").addEventListener("input", () => { S.sort = $("fsort").value; S.dir = 1; render(); });
$("fclear").onclick = () => { clearFilters(); $("q").focus(); };
$("q").addEventListener("input", () => { $("qclear").hidden = !$("q").value; if (S.tab !== "items" && S.tab !== "expired") S.tab = "items"; render(); });
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { const b = $("view").querySelector(".iname"); if (b && S.rows.length === 1) b.click(); } });
$("qclear").onclick = () => { $("q").value = ""; $("qclear").hidden = true; render(); $("q").focus(); };
$("scrim").onclick = () => closeItem();
dockMQ.addEventListener("change", updateModal);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !e.defaultPrevented) {
    const rb = $("renamebox");
    if (rb && rb.contains(document.activeElement)) return closeRename();
    if (S.open) return closeItem();
    if (rb) return closeRename();
    if (document.activeElement === $("q") && $("q").value) { $("q").value = ""; $("qclear").hidden = true; render(); }
  }
  if (e.key === "Tab" && S.open && !dockMQ.matches) {
    const f = [...$("drawer").querySelectorAll("button, a[href], input, textarea, select, summary, [tabindex='0']")].filter(x => !x.disabled && x.offsetParent !== null);
    if (f.length) { const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
  }
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey && !isTyping()) { e.preventDefault(); if (S.open && !dockMQ.matches) closeItem(false); $("q").focus(); $("q").select(); }
});
document.addEventListener("focusin", e => { S.editing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.target.id !== "q"; });
document.addEventListener("focusout", () => setTimeout(() => { if (!isTyping()) S.editing = false; }, 0));
if ($("ver").textContent.startsWith("__")) api("/api/about").then(a => { S.about = a; $("ver").textContent = a.version; }).catch(() => $("ver").textContent = "");
load();
setInterval(() => { if (!S.editing && !document.hidden) load(true); }, 15000);
</script>
</body>
</html>
