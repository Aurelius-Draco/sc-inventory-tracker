Switch on one or more category filters (Armor, Weapons, Vehicles and so on) before you press Stack. The tracker sees which are on, scans just those, and slots the result into your last full scan. Use a whole category (All Categories in its menu), not part of one. Changing a filter mid-scan starts a fresh scan of the new selection."]}, {"head": "Scanning quickly", "items": ["Rest the mouse on each item for about half a second. A click sound and a green dot mean it's recorded.", "For a run of identical items, hover only the first and the last. Everything between is filled in (blue dot) because the kiosk sorts by name. It works across pages too.", "Amber outlines are tiles still to hover. Scroll each page to the bottom so the tracker sees every tile. Scrolling back and hovering again never double counts.", "Locked (expired) items still need a hover so the count comes out right. For a two-slot locked item, hover its left half.", "If a name comes out cut off, the tooltip was still appearing. Hold still a moment longer; the tracker has another look by itself. Press Insert to force a capture.", "Don't move items in or out, stack, or use the freight elevator while scanning. The list changes and the scan starts again."]}, {"head": "At shops", "items": ["At a shop terminal, press Insert and the overlay labels every item on screen that you already have in storage, with how many and where. Set it to automatic in Settings if you don't mind the extra CPU."]}, {"head": "Getting the exact total", "items": ["Open the freight elevator terminal, clear any filter or search, and scroll its list to the very bottom. The game logs the exact item count and the tracker uses it to confirm the scan is complete."]}, {"head": "Between scans", "items": ["Items you move in or out of station storage, and things you buy at shops, are picked up from the game's log automatically, even for sessions when the tracker wasn't running.", "The log can't see freight elevator moves or which commodity you sold. The dashboard flags those so you can fix them by hand or rescan.", "A fresh scan always replaces earlier edits for that station, because a scan shows what's really there.", "If Excel has a CSV file open, the tracker can't update it. Close it and it updates next time."]}], "links": [{"head": "Ship loadouts", "items": [{"name": "Erkul", "url": "https://www.erkul.games", "about": "Build, compare and share ship loadouts. Check the parts here before you buy."}, {"name": "SPViewer", "url": "https://www.spviewer.eu", "about": "Ship performance and loadout comparisons."}, {"name": "Star Citizen Armory", "url": "https://armory.thespacecoder.space", "about": "Plan a personal (FPS) loadout and get a shopping list."}]}, {"head": "Prices, trading and hauling", "items": [{"name": "UEX", "url": "https://uexcorp.space", "about": "Commodity and item prices reported by players, trade and mining routes."}, {"name": "SC Trade Tools", "url": "https://sc-trade.tools", "about": "Trade and mining routes, commodity prices, refinery yields."}, {"name": "SC Hauling Tools", "url": "https://sc-hauling.tools", "about": "Stop and delivery order for hauling contracts."}]}, {"head": "Finding items, missions and crafting", "items": [{"name": "Cornerstone Item Finder", "url": "https://finder.cstone.space", "about": "Where to buy personal and ship equipment, with stats."}, {"name": "SC Mission Database", "url": "https://scmdb.net", "about": "Missions, crafting blueprints, resources and mining."}, {"name": "Star Citizen Wiki API", "url": "https://star-citizen.wiki", "about": "Item data this tracker uses for stats and prices."}]}, {"head": "Maps and places", "items": [{"name": "VerseGuide", "url": "https://verseguide.com", "about": "Find locations in the verse."}, {"name": "Star Citizen Maps", "url": "https://maps.adi.sc", "about": "3D ship interiors with points of interest."}]}, {"head": "Wikis and lists", "items": [{"name": "Star Citizen Tools wiki", "url": "https://starcitizen.tools", "about": "Comm
