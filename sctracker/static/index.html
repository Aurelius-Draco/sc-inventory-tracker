<style>
:root {

    --line: #dce0e5; --line2: #b6bec8; --text: #13171c; --muted: #4f5965;
    --amber: #8c5000; --on-amber: #ffffff; --teal: #0a6b5f; --rust: #a23a22; --fresh: #2c5a84;
    --amber-bg: rgba(140,80,0,.08); --amber-line: rgba(140,80,0,.5); --teal-bg: rgba(10,107,95,.08); --rust-bg: rgba(162,58,34,.08); --fresh-bg: rgba(44,90,132,.08);
    --hover: rgba(19,30,45,.045); --zebra: rgba(19,30,45,.022); --sel: rgba(140,80,0,.08); --sel-hover: rgba(140,80,0,.12);

  --line: #dce0e5; --line2: #b6bec8; --text: #13171c; --muted: #4f5965;
  --amber: #8c5000; --on-amber: #ffffff; --teal: #0a6b5f; --rust: #a23a22; --fresh: #2c5a84;
  --amber-bg: rgba(140,80,0,.08); --amber-line: rgba(140,80,0,.5); --teal-bg: rgba(10,107,95,.08); --rust-bg: rgba(162,58,34,.08); --fresh-bg: rgba(44,90,132,.08);

/* A sparse, static starfield. No animation, painted once. */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(circle at 37px 61px, var(--star) 0 .7px, transparent 1.3px) 0 0 / 460px 460px,
    radial-gradient(circle at 211px 143px, var(--star) 0 .6px, transparent 1.2px) 0 0 / 460px 460px,
    radial-gradient(circle at 389px 297px, var(--star) 0 .8px, transparent 1.4px) 0 0 / 460px 460px,
    radial-gradient(circle at 121px 402px, var(--star) 0 .5px, transparent 1.1px) 0 0 / 460px 460px,
    radial-gradient(circle at 300px 30px, var(--star) 0 .5px, transparent 1.1px) 0 0 / 460px 460px,
    radial-gradient(1100px 520px at 100% -12%, var(--fresh-bg), transparent 62%); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* Shared label style: condensed caps */
.sys h2, .cell dt, th, .blk > h3, .det > summary, .day h3, .grp > h4, .wr.wrh, .slot.slh, .orow.ohead, .eyebrow, .ghn, .tabbar button, .needs-h h3, .dh .eyebrow {
  font-stretch: semi-condensed; text-transform: uppercase; letter-spacing: .07em; }

/* Panels: thin precise border, small radius, no blur */
.frame { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--edge); }

/* Layout */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
main { width: 100%; max-width: 108rem; justify-self: start; padding: var(--s6) var(--s7) 5rem; min-width: 0; container-type: inline-size; }

/* Station rail */
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); scrollbar-width: thin; }
.brand { display: flex; gap: var(--s3); align-items: center; padding: var(--s5) var(--s5) var(--s4); border-bottom: 1px solid var(--line); }
.mark { flex: none; color: var(--amber); display: grid; }

.st:hover { background: var(--hover); }

.st[aria-current="true"]:hover { background: var(--sel-hover); }

.st .nm { font-size: .875rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.st .q { color: var(--muted); font-size: .8125rem; text-align: right; }
.st .fr { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--s2); font-size: .75rem; color: var(--muted); }
.st .fr.warn { color: var(--amber); }
.meter { display: inline-flex; gap: 2px; align-items: flex-end; flex: none; }
.meter i { width: 3px; background: var(--line2); }
.meter i:nth-child(1) { height: 4px; } .meter i:nth-child(2) { height: 6px; } .meter i:nth-child(3) { height: 8px; } .meter i:nth-child(4) { height: 10px; } .meter i:nth-child(5) { height: 12px; }
.meter i.on { background: var(--fresh); }
.meter.old i.on { background: var(--amber); }
.rail-foot { margin-top: auto; padding: var(--s3) var(--s5) var(--s4); border-top: 1px solid var(--line); font-size: .75rem; color: var(--muted); display: grid; gap: 2px; }
.live { display: flex; align-items: center; gap: var(--s2); }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
.live.lost { color: var(--amber); } .live.lost i { background: var(--amber); }
.railnote { padding: var(--s2) var(--s3); font-size: .8125rem; color: var(--muted); }

/* Search */
.search { display: flex; align-items: center; gap: var(--s3); height: 3rem; padding: 0 var(--s2) 0 var(--s4); background: var(--field); border: 1px solid var(--line2); border-radius: var(--r); transition: border-color .12s; }

.iconbtn:hover { color: var(--text); background: var(--hover); }

/* Needs you */
.needs { margin-top: var(--s4); border-color: var(--amber-line); box-shadow: inset 0 2px 0 var(--amber); }
.needs-h { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s3); padding: var(--s3) var(--s5); }
.needs-h h3 { margin: 0; font-size: .875rem; font-weight: 700; color: var(--amber); }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
.need { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: center; padding: var(--s3) var(--s5); border-top: 1px solid var(--line); }
.need p { margin: 0; flex: 1 1 20rem; }
.need .ctl { flex: 0 1 auto; display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.need select, .need .inp { height: var(--h-sm); min-height: 0; max-width: 100%; min-width: 0; }
.needs .more { padding: var(--s2) var(--s5) var(--s3); border-top: 1px solid var(--line); }

.head { margin-top: var(--s4); padding: var(--s5) var(--s6); display: grid; gap: var(--s4); overflow: hidden; background: linear-gradient(180deg, var(--raise), var(--panel) 70%); }
.head::before { content: ""; position: absolute; pointer-events: none; width: 44rem; height: 44rem; right: -14rem; top: 62%; border-radius: 50%;
  background: radial-gradient(circle at 50% 0%, var(--limb), transparent 42%); box-shadow: inset 0 1px 0 var(--limb-line); }
.head::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;

.head.sweep::after { animation: sweep .9s ease-out; }
@keyframes sweep { 0% { opacity: 1; background-position: -40% 0; } 100% { opacity: 1; background-position: 140% 0; } }
.hmain, .readout, .warns { position: relative; z-index: 1; }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); font-size: .6875rem; font-weight: 600; color: var(--muted); letter-spacing: .12em; }
.eyebrow .sysname { color: var(--amber); font-weight: 700; }
.hmain { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--s2) var(--s5); }
.hmain h2 { font-size: 1.875rem; font-weight: 700; font-stretch: condensed; margin: var(--s1) 0 0; line-height: 1.05; overflow-wrap: anywhere; }
.readout { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s7); margin: 0; }
.cell { min-width: 0; padding-left: var(--s3); border-left: 2px solid var(--line2); }
.cell.warn { border-left-color: var(--amber); } .cell.rust { border-left-color: var(--rust); }
.cell dt { font-size: .6875rem; font-weight: 600; color: var(--muted); }
.cell dd { margin: 2px 0 0; font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: var(--s2); white-space: nowrap; line-height: 1.3; }
.cell.warn dd { color: var(--amber); } .cell.rust dd { color: var(--rust); }
.cell .sub { white-space: normal; }
.warns { display: grid; gap: var(--s2); }
.notice { display: flex; gap: var(--s2); align-items: flex-start; margin: 0; padding: var(--s2) var(--s3); border: 1px solid var(--line2); border-left: 2px solid var(--amber); background: var(--raise); border-radius: var(--r-sm); font-size: .875rem; }
.notice > svg { flex: none; color: var(--amber); margin-top: 2px; }
.notice b { color: var(--amber); }
.notice.rust { border-left-color: var(--rust); } .notice.rust > svg, .notice.rust b { color: var(--rust); }
.rename { margin-top: var(--s3); padding: var(--s4) var(--s5); display: grid; gap: var(--s3); }
.rh { display: flex; justify-content: space-between; gap: var(--s3); align-items: flex-start; }
.rh h3 { margin: 0 0 2px; font-size: 1rem; }
.rh p { margin: 0; }
.placelist { max-height: 18rem; overflow-y: auto; border: 1px solid var(--line2); border-radius: var(--r-sm); max-width: 35rem; background: var(--field); }
.placelist button { display: flex; justify-content: space-between; gap: var(--s3); width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: var(--s2) var(--s3); }
.placelist button:last-child { border-bottom: 0; }
.placelist button:hover { background: var(--hover); }
.placelist button:focus-visible { outline-offset: -2px; }
.placelist button[aria-current="true"] { background: var(--sel); box-shadow: inset 2px 0 0 var(--amber); }

/* Tabs: opaque, sticky, one underline for the active one */
.tabbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: stretch; gap: 0; height: 3rem; margin: var(--s6) calc(-1 * var(--s7)) 0; padding: 0 calc(var(--s7) - var(--s3)); overflow-x: auto; scrollbar-width: none; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabbar::-webkit-scrollbar { display: none; }
.tabbar button { position: relative; flex: none; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3); background: none; border: 0; color: var(--muted); font-size: .9375rem; font-weight: 700; white-space: nowrap; }
.tabbar button:hover { color: var(--text); }
.tabbar button[aria-selected="true"] { color: var(--text); }
.tabbar button[aria-selected="true"]::after { content: ""; position: absolute; left: var(--s3); right: var(--s3); bottom: -1px; height: 2px; background: var(--amber); }
.tabbar button:focus-visible { outline-offset: -4px; }
.tabbar .t2 { margin-left: auto; }
.count { font-size: .6875rem; line-height: 1.125rem; min-width: 1.375rem; padding: 0 5px; text-align: center; border-radius: 2px; background: var(--raise2); color: var(--muted); font-weight: 700; letter-spacing: 0; }
.count.teal { color: var(--teal); } .count.rust { color: var(--rust); }
.count:empty { display: none; }

/* Filters: one control height */
.filters { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin: var(--s4) 0 0; }
label.sel { display: inline-flex; align-items: center; gap: var(--s2); font-size: .8125rem; color: var(--muted); }
select, .inp, .field input, .field textarea, textarea { background: var(--field); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 0 var(--s3); color: var(--text); height: var(--h); }
textarea, .field textarea { height: auto; padding: var(--s2) var(--s3); }
select { padding-right: var(--s1); }
select:hover, .inp:hover, .field input:hover, textarea:hover { border-color: var(--muted); }
select:focus, .inp:focus, .field input:focus, textarea:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.chipt { display: inline-flex; align-items: center; gap: var(--s2); height: var(--h); padding: 0 var(--s3) 0 var(--s2); border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--field); font-size: .8125rem; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
.chipt:hover { color: var(--text); border-color: var(--muted); }
.chipt input { appearance: none; -webkit-appearance: none; flex: none; width: 14px; height: 14px; margin: 0; border: 1.5px solid var(--line2); border-radius: 2px; background: var(--field); }
.chipt input:checked { background: var(--amber); border-color: var(--amber); box-shadow: inset 0 0 0 2px var(--field); }
.chipt input:focus { outline: none; }
.chipt:has(input:checked) { color: var(--text); border-color: var(--amber-line); }
.chipt:has(input:focus-visible) { outline: 2px solid var(--amber); outline-offset: 2px; }
.fend { margin-left: auto; display: flex; gap: var(--s3); align-items: center; font-size: .8125rem; color: var(--muted); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); height: var(--h); padding: 0 var(--s4); border: 1px solid var(--amber); border-radius: var(--r-sm); background: var(--amber); color: var(--on-amber); font-weight: 600; white-space: nowrap; transition: filter .12s, background-color .12s, border-color .12s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { filter: brightness(.94); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost { background: var(--raise); color: var(--text); border-color: var(--line2); }
.btn.ghost:hover { filter: none; background: var(--raise2); border-color: var(--muted); }
.btn.sm { height: var(--h-sm); padding: 0 var(--s3); font-size: .8125rem; }
.link { background: none; border: 0; padding: 2px 0; color: var(--teal); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-align: left; white-space: nowrap; }
.link:hover { color: var(--text); }
.link.danger { color: var(--rust); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line2); border-radius: var(--r-sm); overflow: hidden; background: var(--field); }
.seg button { height: var(--h-sm); background: none; border: 0; border-left: 1px solid var(--line2); padding: 0 var(--s3); color: var(--muted); font-weight: 600; font-size: .8125rem; }
.seg button:first-child { border-left: 0; }
.seg button:hover { color: var(--text); background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--raise2); color: var(--text); box-shadow: inset 0 -2px 0 var(--amber); }
.seg button:focus-visible { outline-offset: -3px; }

/* Tables */
.tablewrap { margin-top: var(--s3); }
.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .6875rem; font-weight: 700; color: var(--muted); padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line2); background: var(--thead); white-space: nowrap; }
th button { display: inline-flex; align-items: center; gap: var(--s1); background: none; border: 0; padding: 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; }
th button:hover, th[aria-sort] button { color: var(--text); }
th .arr { color: var(--amber); font-size: .625rem; }
td { padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tr.row { cursor: pointer; }
table.items { border-radius: var(--r); }
table.items thead th { position: sticky; top: var(--tabh, 3rem); z-index: 5; height: 2.375rem; padding-top: 0; padding-bottom: 0; color: var(--text); font-size: .75rem; border-bottom: 0; box-shadow: inset 0 -2px 0 var(--amber); }
table.items thead th:first-child { border-top-left-radius: var(--r); }
table.items thead th:last-child { border-top-right-radius: var(--r); }
table.items td { padding: 6px var(--s3); vertical-align: middle; border-bottom: 1px solid var(--line); }
table.items td:first-child, table.items th:first-child { padding-left: var(--s5); }
table.items td:last-child, table.items th:last-child { padding-right: var(--s5); }
table.items tr.row > td { background: transparent; }
table.items tr.row.alt > td { background: var(--zebra); }
table.items tr.row:hover > td { background: var(--hover); }
table.items tr.row.sel > td { background: var(--sel); }
table.items tr.row.sel:hover > td { background: var(--sel-hover); }
table.items tr.row.sel > td:first-child { box-shadow: inset 2px 0 0 var(--amber); }
.c-item { min-width: 14rem; width: 40%; }
.filters select { max-width: 13rem; }
.c-qty { width: 1%; white-space: nowrap; }
.c-qty .delta { margin: 0 var(--s2) 0 0; vertical-align: 1px; }
.c-val { width: 1%; min-width: 7.5rem; }
.val { font-weight: 600; }
.vsm small { color: var(--muted); }
.each { display: block; font-size: .75rem; color: var(--muted); line-height: 1.2; }
.noval { display: inline-block; width: .875rem; height: 1px; background: var(--line2); vertical-align: middle; }
.vsm { margin-top: 2px; font-size: .8125rem; }
.c-st { white-space: nowrap; width: 1%; }

table.items tr.gh th { position: static; padding: 0; height: auto; box-shadow: none; background: var(--panel); border: 0; white-space: normal; text-transform: none; letter-spacing: 0; }

.ghm { font-size: .75rem; font-weight: 500; color: var(--muted); }

.chip.edit { color: var(--amber); background: var(--amber-bg); }

.chip.tag { color: var(--muted); box-shadow: inset 0 0 0 1px var(--line2); font-weight: 500; }
.sub { color: var(--muted); font-size: .8125rem; }

th small { font-size: .625rem; color: var(--muted); letter-spacing: .04em; }
.tfoot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--s2) var(--s5); margin: var(--s3) 0 0; }
.intro { color: var(--muted); max-width: 75ch; margin: var(--s4) 0 0; }

/* Empty states */
.empty { margin-top: var(--s4); padding: var(--s7) var(--s6); text-align: center; border: 1px dashed var(--line2); border-radius: var(--r); color: var(--muted); }

.ering { display: inline-block; width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 1px solid var(--line2); position: relative; background: radial-gradient(circle, var(--muted) 0 2px, transparent 2.5px); }
.ering::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 1px dashed var(--line2); }

/* Changes */
.day { margin-top: var(--s6); }
.day h3 { margin: 0 0 var(--s2); font-size: .6875rem; font-weight: 700; color: var(--muted); }
.chgs { list-style: none; margin: 0; padding: 0; }
.chg { display: grid; grid-template-columns: 3.5rem 4.5rem minmax(0, 1fr) 12rem; gap: 2px var(--s4); align-items: center; padding: var(--s2) var(--s5); border-bottom: 1px solid var(--line); }
.chg:last-child { border-bottom: 0; }

.dl { font-weight: 700; font-size: 1rem; text-align: right; }
.dl.up { color: var(--teal); } .dl.down { color: var(--rust); }
.chg .what { min-width: 0; display: flex; flex-wrap: wrap; gap: 0 var(--s3); align-items: baseline; }
.chg .src { display: flex; gap: var(--s3); align-items: center; justify-content: flex-end; }

/* Item panel */
.drawer { position: fixed; top: 0; right: 0; z-index: 20; width: var(--panelw); height: 100vh; overflow-y: auto; overscroll-behavior: contain; background: var(--panel); border-left: 1px solid var(--line2); box-shadow: var(--shadow);
  transform: translateX(102%); visibility: hidden; transition: transform .2s cubic-bezier(.2,.8,.2,1), visibility 0s linear .2s; }
.drawer.open { transform: none; visibility: visible; transition: transform .2s cubic-bezier(.2,.8,.2,1); }

.scrim.show { opacity: 1; pointer-events: auto; }
.dh { position: sticky; top: 0; z-index: 2; padding: var(--s5) 3.5rem var(--s4) var(--s6); background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: inset 0 -2px 0 var(--amber); }

.db { padding: 0 var(--s6) 3rem; }
.blk { padding: var(--s5) 0; border-bottom: 1px solid var(--line); }

.big { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--s1) var(--s3); }

.blk p { margin: var(--s2) 0 0; }
.form { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: flex-end; margin-top: var(--s3); }
.field { display: flex; flex-direction: column; gap: 6px; position: relative; min-width: 0; }
.field > label, .field > span { font-size: .8125rem; font-weight: 600; color: var(--muted); }
.field.n { flex: 0 0 7rem; } .field.grow { flex: 1 1 12rem; }
.field textarea { min-height: 4.5rem; resize: vertical; width: 100%; }
.warnt { color: var(--amber); }
.spots { list-style: none; margin: 0; padding: 0; }
.spots li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--s4); padding: var(--s2) 0; border-bottom: 1px solid var(--line); }
.spots li:last-child { border-bottom: 0; }
.spots .pl { display: block; overflow-wrap: anywhere; }
.spots b { text-align: right; white-space: nowrap; }
.stale { color: var(--amber); }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--s1) var(--s5); margin: 0; }

.det > summary { cursor: pointer; list-style: none; margin: 0; }

.det > summary::after { content: "Show"; color: var(--teal); text-transform: none; letter-spacing: 0; font-weight: 600; font-size: .8125rem; text-decoration: underline; text-underline-offset: 3px; }
.det[open] > summary { margin-bottom: var(--s3); } .det[open] > summary::after { content: "Hide"; }
.cmp td, .cmp th { padding: 5px var(--s2); font-size: .8125rem; }
.cmp th { background: none; font-size: .6875rem; }
.cmp tr.this td { color: var(--amber); font-weight: 600; background: var(--sel); }
.bar { display: block; height: 2px; margin-top: 3px; background: var(--line); overflow: hidden; min-width: 2.5rem; }
.bar i { display: block; height: 100%; background: var(--fresh); }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: flex; justify-content: space-between; gap: var(--s3); padding: var(--s2) 0; border-bottom: 1px solid var(--line); }
.hist li:last-child { border-bottom: 0; }

/* Add forms, suggestions */
.addcard { margin-top: var(--s4); padding: var(--s4) var(--s5) var(--s5); }
.addcard > h3 { margin: 0 0 var(--s3); font-size: 1rem; }
.addrow { display: grid; grid-template-columns: minmax(0, 2fr) 7rem minmax(0, 1fr) 11rem; gap: var(--s3); align-items: end; }
.addrow.two { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 11rem; }
.addcard .sub { margin: var(--s2) 0 0; }
.sugg { position: absolute; top: 100%; left: 0; min-width: min(28rem, calc(100vw - 2.5rem)); width: 100%; z-index: 40; margin-top: var(--s1); max-height: 21rem; overflow-y: auto; background: var(--raise); border: 1px solid var(--line2); border-radius: var(--r-sm); box-shadow: var(--shadow); }

.sugg [aria-selected="true"], .sugg [aria-selected="true"]:hover { background: var(--sel); box-shadow: inset 2px 0 0 var(--amber); }

.paste { margin-top: var(--s4); }

.paste textarea { display: block; width: 100%; max-width: 40rem; min-height: 7rem; margin: var(--s2) 0 var(--s3); }

/* How to get it */
.how { display: grid; gap: var(--s3); }
.how > p { margin: 0; }
.havel { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); align-items: center; }
.routes { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: var(--s3); }
.route { padding: var(--s3) var(--s4); background: var(--raise); border: 1px solid var(--line); border-top: 2px solid var(--teal); border-radius: var(--r-sm); }

.route.off h4 { color: var(--muted); }
.route h4 { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--s1) var(--s3); margin: 0 0 var(--s2); font-size: .8125rem; font-stretch: semi-condensed; text-transform: uppercase; letter-spacing: .07em; }
.rtag { font-size: .8125rem; font-weight: 500; color: var(--muted); text-transform: none; letter-spacing: 0; }
.route p { margin: var(--s1) 0; }
.route ul.missions { margin: var(--s2) 0; padding-left: var(--s5); }
.route ul.missions li { margin: var(--s1) 0; }

/* Wish list: fixed tracks so every row lines up */
.wl { margin-top: var(--s4); }
.wlh { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--s2) var(--s4); padding: var(--s3) var(--s5); border-bottom: 1px solid var(--line2); }
.wlh h3 { margin: 0; font-size: 1.125rem; font-stretch: condensed; overflow-wrap: anywhere; }
.wlh p { margin: 2px 0 0; }
.prog { flex: 0 0 11rem; height: 4px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--teal); }
.wr { display: grid; grid-template-columns: minmax(0, 2fr) 5.5rem 7rem minmax(0, 1.5fr) 15rem; gap: var(--s2) var(--s4); align-items: center; padding: var(--s2) var(--s5); border-bottom: 1px solid var(--line); }
.wr:hover:not(.wrh) { background: var(--hover); }
.wr.wrh { padding-top: 0; padding-bottom: 0; height: 2.25rem; background: var(--thead); font-size: .6875rem; font-weight: 700; color: var(--muted); }
.wn { display: flex; gap: var(--s2); align-items: flex-start; min-width: 0; }

.wq { justify-self: end; }

.need-n { color: var(--amber); font-weight: 700; } .have-n { color: var(--teal); font-weight: 700; }
.acts { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); align-items: center; justify-content: flex-end; }
.howbox { padding: var(--s4) var(--s5) var(--s5); background: var(--well); border-bottom: 1px solid var(--line); }

/* Ships */
.ship { margin-top: var(--s4); }
.shiph { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--s2) var(--s4); padding: var(--s3) var(--s5); }
.shiptoggle { display: flex; align-items: center; gap: var(--s3); background: none; border: 0; padding: var(--s1) 0; text-align: left; min-width: 0; }

.shipmeta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); align-items: center; }
.grp { border-top: 1px solid var(--line2); }
.grp > h4 { margin: 0; padding: 7px var(--s5); font-size: .6875rem; font-weight: 700; color: var(--text); background: var(--raise2); border-bottom: 1px solid var(--line); box-shadow: inset 2px 0 0 var(--fresh); }
.slot { display: grid; grid-template-columns: minmax(8rem, 1fr) 3rem minmax(0, 1.8fr) 5.5rem 13rem 3.5rem; gap: var(--s1) var(--s4); align-items: center; padding: var(--s2) var(--s5); border-top: 1px solid var(--line); }
.grp > h4 + .slot { border-top: 0; }
.slot:hover:not(.slh) { background: var(--hover); }
.slot.slh { padding-top: 0; padding-bottom: 0; height: 2.25rem; font-size: .6875rem; font-weight: 700; color: var(--muted); border-top: 1px solid var(--line); background: var(--thead); }
.slot.mine { box-shadow: inset 2px 0 0 var(--amber); }
.sf { min-width: 0; display: flex; flex-wrap: wrap; gap: 2px var(--s2); align-items: center; }
.sf .fname { font-weight: 600; overflow-wrap: anywhere; }
.sf .sub { flex-basis: 100%; }
.size { font: 600 .75rem var(--mono); padding: 1px 5px; border: 1px solid var(--line2); border-radius: 2px; color: var(--muted); }
.sa { display: flex; flex-wrap: nowrap; gap: var(--s2) var(--s3); align-items: center; justify-content: flex-start; }
.sw { display: flex; justify-content: flex-end; align-items: center; gap: var(--s2); cursor: pointer; }
.sw input { width: 16px; height: 16px; accent-color: var(--amber); margin: 0; }
.sm-only { display: none; }
.opts { padding: var(--s4) var(--s5) var(--s5); background: var(--well); border-top: 1px solid var(--line); }
.opth { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--s2) var(--s4); align-items: center; margin-bottom: var(--s3); }
.opth h4 { margin: 0; font-size: 1rem; }
.optf { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.optf .chipt, .optf select { height: var(--h-sm); }
.olist { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel); overflow: hidden; }
.orow { display: grid; grid-template-columns: minmax(9rem, 1.6fr) minmax(6.5rem, 1fr) 3.75rem 3.75rem 5rem 4rem 7.5rem; gap: var(--s1) var(--s3); align-items: center; padding: 6px var(--s4); border-top: 1px solid var(--line); font-size: .875rem; }
.olist.has-main .orow { grid-template-columns: minmax(9rem, 1.6fr) minmax(6.5rem, 1fr) 5.5rem 3.75rem 3.75rem 5rem 4rem 7.5rem; }
.orow .on .link { font-size: .75rem; padding: 0; }
.orow:hover:not(.ohead) { background: var(--hover); }
.orow.ohead { border-top: 0; height: 2.25rem; padding-top: 0; padding-bottom: 0; background: var(--thead); font-size: .6875rem; font-weight: 700; color: var(--muted); }
.orow.this, .orow.this:hover { background: var(--sel); box-shadow: inset 2px 0 0 var(--amber); }
.orow.this .on b { color: var(--amber); }
.orow .on { min-width: 0; overflow-wrap: anywhere; }
.orow .acts { flex-wrap: nowrap; }
.sm-lbl { display: none; }
.ohow { padding: var(--s4); background: var(--well); border-top: 1px solid var(--line); }
.shipfoot { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: center; padding: var(--s3) var(--s5); border-top: 1px solid var(--line2); }
.pad { padding: var(--s4) var(--s5); margin: 0; }

/* Tips, links, settings, about */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 21rem), 1fr)); gap: var(--s4); margin-top: var(--s4); }
.card { padding: var(--s4) var(--s5); }
.card h3 { display: flex; gap: var(--s3); align-items: baseline; margin: 0 0 var(--s2); font-size: 1rem; }
.idx { font: 600 .75rem var(--mono); color: var(--amber); }
.card ul { margin: 0; padding-left: var(--s4); }
.card li { margin: var(--s2) 0; line-height: 1.5; }
.card li::marker { color: var(--line2); }
.tipfig { margin: var(--s4) 0 0; }
.tipfig a { display: block; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: #000; }
.tipfig a:hover, .tipfig a:focus-visible { border-color: var(--line2); }
.tipfig img { display: block; width: 100%; height: auto; }
.tipfig figcaption { margin-top: var(--s2); color: var(--muted); font-size: .8125rem; }
.linkl { list-style: none; padding: 0 !important; }
.linkl li { padding: var(--s2) 0; border-bottom: 1px solid var(--line); margin: 0 !important; }
.linkl li:last-child { border-bottom: 0; }
.linkl a { font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.setgrid { display: grid; gap: var(--s4); max-width: 55rem; margin-top: var(--s4); }
.set { padding: var(--s4) var(--s5); }
.set > h3 { margin: 0 0 var(--s1); font-size: 1rem; }
.set > p { margin: 0 0 var(--s2); }
.opt { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); gap: var(--s1) var(--s3); align-items: start; padding: var(--s3) 0; border-top: 1px solid var(--line); cursor: pointer; }
.opt b { display: block; font-weight: 600; }
.opt .sub { display: block; }
.opt select, .opt .inp { display: block; }
.switch { appearance: none; -webkit-appearance: none; position: relative; width: 2.25rem; height: 1.25rem; margin: 1px 0 0; border-radius: 2px; background: var(--line2); transition: background .12s; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: .875rem; height: .875rem; border-radius: 1px; background: var(--text); transition: left .12s; }
.switch:checked { background: var(--amber); } .switch:checked::after { left: calc(100% - .875rem - 3px); background: var(--on-amber); }
.switch:focus { outline: none; } .switch:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.savebar { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: center; padding-top: var(--s3); border-top: 1px solid var(--line); }
.about { max-width: 72ch; margin-top: var(--s4); padding: var(--s5) var(--s6); }
.about h3 { margin: var(--s6) 0 var(--s2); font-size: 1rem; } .about h3:first-child { margin-top: 0; }
.about .lead { font-size: 1.125rem; color: var(--text); }
.about ul { padding-left: var(--s5); } .about li { margin: var(--s2) 0; }
.about .who { display: flex; gap: var(--s5); align-items: flex-start; }
.about .portrait { flex: none; width: 120px; height: 120px; object-fit: cover; border: 1px solid var(--line2); border-radius: 4px; }
.about ul.alinks { list-style: none; padding: 0; margin: var(--s5) 0 0; border-top: 1px solid var(--line); }
.about ul.alinks li { margin: 0; padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
.about ul.shipwish { list-style: none; padding: 0; margin: var(--s3) 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); gap: var(--s2); }
.about ul.shipwish li { margin: 0; padding: var(--s3); border: 1px solid var(--line); border-radius: 4px; display: grid; gap: 2px; align-content: start; }
.about ul.shipwish a { font-weight: 700; }
.about ul.shipwish .mk { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
.about ul.shipwish .why { font-size: .875rem; }

/* Toast */

<body>
<a class="skip" href="#view">Skip to the list</a>
<div class="shell" id="shell">
  <aside class="rail" aria-label="Stations">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.6"><polygon points="17,2 30,9.5 30,24.5 17,32 4,24.5 4,9.5"/><rect x="11" y="12" width="12" height="10"/><path d="M11 17h12"/></svg></span>
      <div><h1>Storage manifest</h1><p>SC Inventory Tracker <span id="ver">__VERSION__</span></p></div>
    </div>
    <nav class="stlist" id="rail" aria-label="Choose a station"></nav>
    <div class="rail-foot" id="railfoot"></div>
  </aside>
  <main id="main">
    <div class="search" role="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <label class="sr" for="q">Find an item</label>
      <input id="q" type="search" placeholder="Find an item, maker, type, tag or note" autocomplete="off" spellcheck="false">
      <button class="iconbtn" id="qclear" type="button" aria-label="Clear search" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <kbd title="Press / from anywhere to search">/</kbd>
    </div>
    <div id="needs"></div>
    <div class="head frame" id="head"></div>
    <div class="tabbar" role="tablist" id="tabs" aria-label="Sections">
      <button role="tab" id="tab-items" data-tab="items" aria-controls="view" aria-selected="true">Items <span class="count" id="c-items"></span></button>
      <button role="tab" id="tab-changes" data-tab="changes" aria-controls="view" aria-selected="false" tabindex="-1">Changes <span class="count teal" id="c-changes"></span></button>
      <button role="tab" id="tab-expired" data-tab="expired" aria-controls="view" aria-selected="false" tabindex="-1">Expired <span class="count rust" id="c-expired"></span></button>
      <button role="tab" id="tab-wish" data-tab="wish" aria-controls="view" aria-selected="false" tabindex="-1">Wish list <span class="count" id="c-wish"></span></button>
      <button role="tab" id="tab-ships" data-tab="ships" aria-controls="view" aria-selected="false" tabindex="-1">Ships</button>
      <button role="tab" id="tab-tips" data-tab="tips" aria-controls="view" aria-selected="false" tabindex="-1" class="t2">Tips</button>
      <button role="tab" id="tab-links" data-tab="links" aria-controls="view" aria-selected="false" tabindex="-1">Links</button>
      <button role="tab" id="tab-settings" data-tab="settings" aria-controls="view" aria-selected="false" tabindex="-1">Settings</button>
      <button role="tab" id="tab-about" data-tab="about" aria-controls="view" aria-selected="false" tabindex="-1">About</button>
    </div>

      <label class="sel">Type <select id="ftype"><option value="">Any</option></select></label>
      <label class="sel">Sort by <select id="fsort">
        <option value="name">Name</option><option value="qty">Quantity</option><option value="value">Value</option>
        <option value="changed">Recently changed</option><option value="station">Station</option><option value="type" selected>Type</option>
      </select></label>
      <label class="chipt"><input type="checkbox" id="fchanged"> Changed since the scan</label>
      <label class="chipt"><input type="checkbox" id="freg"> Registered to you</label>
      <label class="chipt"><input type="checkbox" id="fspread"> At more than one station</label>
      <label class="chipt"><input type="checkbox" id="fammo" checked> Hide magazines and batteries</label>

</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>


<script>
const TOKEN = "__TOKEN__";
const S = { model: null, station: "", tab: "items", sort: "type", dir: 1, open: null, opener: null, tips: null, settings: null, links: null, about: null, ships: null,
  editing: false, viewTok: 0, last: "", shipOpen: {}, opt: {}, optCache: {}, want: {}, wishOpen: {}, howCache: {}, needSel: {}, needsAll: false, wishList: "", rows: [] };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => n == null || n === "" ? "" : Math.round(n).toLocaleString();
const signed = (n) => (n > 0 ? "+" : n < 0 ? "\u2212" : "") + fmt(Math.abs(n));
const plural = (n, one, many) => `${fmt(n)} ${n === 1 ? one : (many || one + "s")}`;
const ago = (ts) => {
  if (!ts) return "";
  const m = (Date.now() / 1000 - ts) / 60;
  if (m < 2) return "just now";
  if (m < 60) return `${Math.round(m)} min ago`;
  if (m < 1440) return `${Math.round(m / 60)} h ago`;
  if (m < 2880) return "yesterday";
  return `${Math.round(m / 1440)} days ago`;
};
const when = (ts) => new Date(ts * 1000).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
const dayLabel = (ts) => {
  const d = new Date(ts * 1000), t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((t - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  if (diff === 0) return "Today"; if (diff === 1) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
};
const daysSince = (s) => { const t = Date.parse(s); return isNaN(t) ? null : (Date.now() - t) / 864e5; };
const prettyDate = (s) => { const t = Date.parse(s); return isNaN(t) ? s : new Date(t).toLocaleDateString(undefined, { day: "numeric", month: "short" }); };
const HIDE_AMMO = /^(magazine|battery|bat)$/i;
const SYS_ORDER = ["Stanton", "Pyro", "Nyx"];
const ICON = {
  x: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  warn: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>`,
  check: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>`,
  chev: `<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`,
  ext: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>`
};
const emptyState = (t, p, a = "") => `<div class="empty"><span class="ering" aria-hidden="true"></span><h3>${t}</h3><p>${p}</p>${a ? `<div class="eacts">${a}</div>` : ""}</div>`;
const readout = (cells) => `<dl class="readout">${cells.map(([l, v, t, tone]) => `<div class="cell${tone ? " " + tone : ""}"${t ? ` title="${esc(t)}"` : ""}><dt>${l}</dt><dd>${v}</dd></div>`).join("")}</dl>`;
const notice = (b, t, cls = "") => `<p class="notice ${cls}">${ICON.warn}<span><b>${b}</b> ${t}</span></p>`;
const isTyping = () => { const a = document.activeElement; return !!a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable); };
const dockMQ = window.matchMedia("(min-width: 1500px)");

async function api(path, body) {
  const opt = { headers: { "X-Token": TOKEN } };
  if (body) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}
function toast(msg, err) {
  const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !!err); t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), err ? 5000 : 2800);
}
const problem = (e) => e instanceof TypeError ? "Can't reach the tracker. Check it's still running, then try again." : e.message;
async function post(path, body) {
  try {
    const j = await api(path, body);
    if (j.model) { S.model = j.model; S.last = JSON.stringify(j.model); }
    S.howCache = {};
    toast(j.message || "Saved."); render(); return true;
  } catch (e) { toast(problem(e), true); return false; }
}
async function load(auto) {
  try {
    const m = await api("/api/model");
    const sig = JSON.stringify(m);
    renderFoot(true, m);
    if (auto && sig === S.last) return;
    const first = !S.model;
    S.last = sig; S.model = m; render(auto);
    if (!first) { const h = $("head"); h.classList.remove("sweep"); void h.offsetWidth; h.classList.add("sweep"); }
    if (auto && S.open && !$("drawer").contains(document.activeElement)) refreshOpen();
  } catch (e) {
    if (S.model) { renderFoot(false, S.model); return; }
    $("view").innerHTML = emptyState("Can't reach the tracker", `Check the tracker window is still open, then reload this page. <span class="sub">(${esc(e.message)})</span>`, `<button class="btn" type="button" onclick="location.reload()">Reload the page</button>`);
  }
}
function renderFoot(ok, m) {
  const gen = Date.parse(m.generated);
  $("railfoot").innerHTML = `<div class="live${ok ? "" : " lost"}"><i aria-hidden="true"></i>${ok ? `Up to date${isNaN(gen) ? "" : `, ${clock(gen / 1000)}`}` : "Lost touch with the tracker. Retrying..."}</div>
    ${m.game_version ? `<div>Game version ${esc(m.game_version)}</div>` : ""}`;
}

/* ---------- stations ---------- */
const freshLevel = (age) => age == null ? 0 : age < 1 ? 5 : age < 3 ? 4 : age < 7 ? 3 : age < 14 ? 2 : 1;
const meter = (age) => { const l = freshLevel(age); return `<span class="meter${age > 7 ? " old" : ""}" aria-hidden="true">${[1, 2, 3, 4, 5].map(k => `<i class="${k <= l ? "on" : ""}"></i>`).join("")}</span>`; };
function stationNote(s) {
  const sc = s.scan;
  if (!sc) return { warn: true, text: "Not scanned yet, log changes only" };
  if (sc.before_patch) return { warn: true, text: "Scanned before the last patch" };
  if (s.untracked_changes) return { warn: true, text: "Changed outside the log, rescan" };
  if (sc.repeat_warning) return { warn: true, text: "Kiosk listed items twice, rescan" };
  if (!sc.complete) return { warn: true, text: "Scan not finished" };
  return { warn: s.age_days > 7, text: `Scanned ${ago(sc.last)}` };
}
function systems() {
  const by = {};
  for (const s of S.model.stations) (by[s.system || "Other"] ||= []).push(s);
  const rank = (k) => { const i = SYS_ORDER.indexOf(k); return i < 0 ? 99 : i; };
  return Object.entries(by).sort((a, b) => rank(a[0]) - rank(b[0]) || a[0].localeCompare(b[0]));
}
function renderRail() {
  const m = S.model, total = m.items.reduce((a, i) => a + i.qty, 0);
  let h = `<button class="st" type="button" data-st="" data-fk="st:" aria-current="${S.station === ""}">
    <span class="nm">All stations</span><span class="q">${fmt(total)}</span><span class="fr">${plural(m.stations.length, "station")}</span></button>`;
  for (const [sys, list] of systems()) {
    h += `<div class="sys" role="group" aria-label="${esc(sys)}"><h2>${esc(sys)}</h2>`;
    for (const s of list) {
      const n = stationNote(s);
      h += `<button class="st" type="button" data-st="${esc(s.key)}" data-fk="st:${esc(s.key)}" aria-current="${S.station === s.key}" title="${esc(s.name)}">
        <span class="nm">${esc(s.name)}</span><span class="q"><span class="sr">Items: </span>${fmt(s.qty)}</span>
        <span class="fr${n.warn ? " warn" : ""}">${meter(s.age_days)}<span>${esc(n.text)}</span></span></button>`;
    }
    h += `</div>`;
  }
  if (!m.stations.length) h += `<p class="railnote">Stations appear here after your first scan.</p>`;
  $("rail").innerHTML = h;
}

/* ---------- filters ---------- */
const SORTS = {
  name: [(a, b) => a.name.localeCompare(b.name), 1],
  qty: [(a, b) => S.tab === "expired" ? a.expired - b.expired : a.qty - b.qty, -1],
  value: [(a, b) => (a.value || 0) - (b.value || 0), -1],
  changed: [(a, b) => (a.last_change || 0) - (b.last_change || 0), -1],
  station: [(a, b) => (a.location || "").localeCompare(b.location || "") || a.name.localeCompare(b.name), 1],
  type: [(a, b) => (a.item_type || "\uffff").localeCompare(b.item_type || "\uffff") || a.name.localeCompare(b.name), 1]
};
function filtered(station = S.station, bare = false) {
  const q = $("q").value.trim().toLowerCase(), type = $("ftype").value;
  let rows = S.model.items.filter(i => !station || i.location_key === station);
  if (S.tab === "expired") rows = rows.filter(i => i.expired > 0);
  else rows = rows.filter(i => i.qty > 0 || i.changed);
  if (bare) return rows;
  if ($("fammo").checked && S.tab !== "expired") rows = rows.filter(i => !HIDE_AMMO.test(i.item_type || ""));
  if (type) rows = rows.filter(i => (i.item_type || "Unknown") === type);
  if ($("fchanged").checked) rows = rows.filter(i => i.changed);
  if ($("freg").checked) rows = rows.filter(i => i.registered > 0);
  if ($("fspread").checked) rows = rows.filter(i => i.also_at.length);
  if (q) rows = rows.filter(i => [i.name, i.manufacturer, i.item_type, i.item_class, i.location, i.note, ...(i.tags || [])]
      .some(v => (v || "").toLowerCase().includes(q)));
  const [by, d] = SORTS[S.sort] || SORTS.name;
  return rows.sort((a, b) => by(a, b) * d * S.dir || a.name.localeCompare(b.name));
}
const filtersActive = () => !!($("q").value.trim() || $("ftype").value || $("fchanged").checked || $("freg").checked || $("fspread").checked);
function clearFilters() {
  $("q").value = ""; $("qclear").hidden = true; $("ftype").value = "";
  ["fchanged", "freg", "fspread"].forEach(id => $(id).checked = false);
  render();
}
function fillTypes() {
  const sel = $("ftype"), cur = sel.value, n = {};
  for (const i of S.model.items) if ((!S.station || i.location_key === S.station) && i.qty > 0) { const t = i.item_type || "Unknown"; n[t] = (n[t] || 0) + 1; }
  const types = Object.keys(n).sort();
  if (cur && !n[cur]) { types.push(cur); n[cur] = 0; }
  sel.innerHTML = `<option value="">Any</option>` + types.map(t => `<option value="${esc(t)}" ${t === cur ? "selected" : ""}>${esc(t)} (${n[t]})</option>`).join("");
}

/* ---------- header ---------- */
function renderHead() {
  const m = S.model;
  if (!S.station) {
    const value = m.items.reduce((a, i) => a + (i.value || 0), 0);
    const kinds = m.items.filter(i => i.qty > 0).length, total = m.items.reduce((a, i) => a + i.qty, 0);
    const oldest = m.stations.filter(s => s.age_days != null && s.scan).sort((a, b) => b.age_days - a.age_days)[0];
    const unscanned = m.stations.filter(s => !s.scan).length;
    const cells = [["Different items", fmt(kinds)], ["In storage", fmt(total)], ["Stations", fmt(m.stations.length)]];
    if (value) cells.push(["Worth about", `${fmt(value)} <small>aUEC</small>`, "At the best sell prices players have reported"]);
    if (oldest) cells.push(["Oldest scan", `${meter(oldest.age_days)} ${ago(oldest.scan.last)}`, oldest.name, oldest.age_days > 7 ? "warn" : ""]);
    $("head").innerHTML = `<div class="hmain"><div><div class="eyebrow">Every station</div><h2>Everything you have stored</h2></div></div>${readout(cells)}
      ${unscanned ? `<div class="warns">${notice(`${plural(unscanned, "station")} not scanned yet.`, "Their counts come from the game log only. Scan them next time you're there.")}</div>` : ""}`;
    return;
  }
  const s = m.stations.find(x => x.key === S.station);
  if (!s) { S.station = ""; return renderHead(); }
  const sc = s.scan, warns = [], cells = [];
  if (sc) {
    cells.push(["Last scan", `${meter(s.age_days)} ${ago(sc.last)}`, when(sc.last), s.age_days > 7 ? "warn" : ""]);
    cells.push(["Kiosk tiles read", `${fmt(sc.identified)}${sc.total ? ` <small>of ${fmt(sc.total)}</small>` : ""}`]);
    if (!sc.complete) warns.push(["Scan not finished.", "Open the kiosk again and press Stack to scan the whole list."]);
    if (sc.newer_partial) warns.push(["A newer scan was started but not finished.", "These counts come from the last complete scan. Finish a full scan next time you're here."]);
    if (sc.before_patch) warns.push(["Scanned before the current game version.", "Patches can change storage, so rescan when you're next here."]);
    if (sc.repeat_warning) warns.push(["The kiosk listed some items twice.", "Close and reopen the kiosk, then scan again."]);
  } else warns.push(["Not scanned yet.", "You're seeing only what the game log picked up. Open the storage kiosk here and press Stack to scan."]);
  cells.push(["Changes since scan", fmt(s.changes || 0)]);
  if (s.expired) cells.push(["Expired", fmt(s.expired), "", "rust"]);
  if (s.value) cells.push(["Worth about", `${fmt(s.value)} <small>aUEC</small>`, "At the best sell prices players have reported"]);
  if (s.untracked_changes) warns.push(["Storage changed in ways the log can't show.", "The freight elevator is the usual cause. Rescan to be sure."]);
  $("head").innerHTML = `<div class="hmain"><div><div class="eyebrow"><span class="sysname">${esc(s.system)}</span><span>Station</span></div><h2>${esc(s.name)}</h2></div>
      <button class="link" type="button" id="rename" aria-expanded="${!!$("renamebox")}" aria-controls="renamebox">Wrong name? Rename it</button></div>
    ${readout(cells)}${warns.length ? `<div class="warns">${warns.map(w => notice(w[0], w[1])).join("")}</div>` : ""}`;
  $("rename").onclick = () => openRename(s);
}

/* ---------- shared: item search box and "how to get it" ---------- */
function itemSearch(el, onPick, endpoint = "/api/suggest") {
  const box = document.createElement("div"); box.className = "sugg"; box.id = el.id + "-list"; box.setAttribute("role", "listbox"); box.hidden = true; el.after(box);
  el.setAttribute("role", "combobox"); el.setAttribute("aria-autocomplete", "list"); el.setAttribute("aria-expanded", "false"); el.setAttribute("aria-controls", box.id);
  let t = null, rows = [], act = -1, seq = 0;
  const show = (on) => { box.hidden = !on; el.setAttribute("aria-expanded", on); };
  const draw = () => {
    box.innerHTML = rows.map((r, k) => `<div role="option" id="${box.id}-${k}" data-k="${k}" aria-selected="${k === act}"><span>${esc(r.name)}</span>
      <span class="sub">${r.have ? `you have ${fmt(r.have)}` : (r.maker ? esc(r.maker) + (r.role ? ", " + esc(r.role) : "") : "")}</span></div>`).join("");
    if (act >= 0) { el.setAttribute("aria-activedescendant", `${box.id}-${act}`); const o = $(`${box.id}-${act}`); if (o) { const top = o.offsetTop, bot = top + o.offsetHeight; if (top < box.scrollTop) box.scrollTop = top; else if (bot > box.scrollTop + box.clientHeight) box.scrollTop = bot - box.clientHeight; } }
    else el.removeAttribute("aria-activedescendant");
    show(rows.length > 0);
  };
  const pick = (k) => { const r = rows[k]; if (!r) return; el.value = r.name; rows = []; act = -1; draw(); onPick(r); };
  el.addEventListener("input", () => {
    clearTimeout(t);
    const q = el.value.trim();
    if (q.length < 2) { rows = []; act = -1; draw(); return; }
    t = setTimeout(async () => {
      const my = ++seq; let r;
      try { r = await api(`${endpoint}?q=${encodeURIComponent(q)}`); } catch (e) { return; }
      if (my !== seq) return;
      rows = r || []; act = -1; draw();
      if (!rows.length) { box.innerHTML = `<div class="none">No matches for \u201c${esc(q)}\u201d. Try fewer letters or another part of the name.</div>`; show(true); }
    }, 180);
  });
  el.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" && rows.length) { e.preventDefault(); act = (act + 1) % rows.length; draw(); }
    else if (e.key === "ArrowUp" && rows.length) { e.preventDefault(); act = (act - 1 + rows.length) % rows.length; draw(); }
    else if (e.key === "Enter" && rows.length && !box.hidden) { e.preventDefault(); pick(act >= 0 ? act : 0); }
    else if (e.key === "Escape" && !box.hidden) { e.preventDefault(); show(false); }
  });
  box.addEventListener("mousedown", e => e.preventDefault());
  box.addEventListener("click", e => { const o = e.target.closest("[role=option]"); if (o) pick(+o.dataset.k); });
  el.addEventListener("blur", () => setTimeout(() => show(false), 120));
}
function fetchHow(id, name) {
  const k = `${id || ""}|${name}`;
  if (S.howCache[k]) return Promise.resolve(S.howCache[k]);
  return api(`/api/howto?id=${encodeURIComponent(id || "")}&name=${encodeURIComponent(name)}`).then(h => (S.howCache[k] = h));
}
function spotLi(s, key) {
  const age = daysSince(s.date);
  return `<li><span><span class="pl">${esc(s.terminal || s.place)}</span><span class="sub">${esc(s.system || "")}${s.date ? `, reported ${age != null && age > 45 ? `<span class="stale">${Math.round(age)} days ago</span>` : esc(prettyDate(s.date))}` : ""}</span></span>
    <b>${fmt(s[key])} <small>aUEC</small></b></li>`;
}
let moreSeq = 0;
function spotList(list, key) {
  const id = "more" + (++moreSeq), top = list.slice(0, 3), rest = list.slice(3);
  return `<ul class="spots">${top.map(s => spotLi(s, key)).join("")}</ul>${rest.length ? `<ul class="spots" id="${id}" hidden>${rest.map(s => spotLi(s, key)).join("")}</ul>
    <button class="link" type="button" data-more="${id}" aria-expanded="false" aria-controls="${id}" style="margin-top:6px">Show ${rest.length} more</button>` : ""}`;

const route = (t, tag, body, off) => `<section class="route${off ? " off" : ""}"><h4>${t}${tag ? `<span class="rtag">${tag}</span>` : ""}</h4>${body}</section>`;
function howtoHtml(h) {
  const owned = h.owned || [], total = owned.reduce((a, o) => a + o.qty, 0);
  let out = `<div class="how">` + (total
    ? `<p class="havel"><span class="chip reg">You have ${fmt(total)}</span><span>${owned.map(o => `${esc(o.location)} (${fmt(o.qty)})`).join(", ")}</span></p>`
    : `<p class="havel"><span class="chip tag">None stored</span><span class="sub">You don't have any in storage.</span></p>`);
  if (!h.found) return out + `<p class="sub">There's no item data for this one yet, so the tracker can't say where to get it.</p></div>`;
  const spec = [h.type, h.size && `Size ${h.size}`, h.grade && `Grade ${h.grade}`, h.item_class].filter(Boolean).join(" \u00b7 ");
  if (spec) out += `<p class="sub">${esc(spec)}</p>`;
  const R = [], buy = (h.buy || []).slice().sort((a, b) => a.buy - b.buy);
  R.push(buy.length ? route("Buy it", `from ${fmt(buy[0].buy)} aUEC`, `<ul class="spots">${buy.slice(0, 4).map(b => spotLi(b, "buy")).join("")}</ul>${buy.length > 4 ? `<p class="sub">And ${buy.length - 4} more shops.</p>` : ""}`)
    : route("Buy it", "", `<p class="sub">Not sold in any shop players have reported to UEX.</p>`, true));
  if (h.craft) {
    const c = h.craft;
    let b = c.default ? `<p>The blueprint is available from the start.</p>` : c.missions.length
      ? `<p>Get the blueprint from ${c.missions.length === 1 ? "this contract" : "one of these contracts"}:</p><ul class="missions">${c.missions.map(m => `<li>${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a>` : esc(m.title)}
          <span class="chip ${m.chance && m.chance < 1 ? "tag" : "reg"}">${m.chance && m.chance < 1 ? `${Math.round(m.chance * 100)}% chance` : "Guaranteed"}</span></li>`).join("")}</ul>`
      : `<p class="sub">Craftable, but the item data doesn't say where the blueprint comes from.</p>`;
    if (c.ingredients.length) b += `<p class="sub"><b>Needs</b> ${c.ingredients.map(i => `${esc(i.name)}${i.scu ? ` ${i.scu} SCU` : i.qty ? ` x${i.qty}` : ""}`).join(", ")}</p>`;
    if (c.time) b += `<p class="sub"><b>Takes</b> ${esc(c.time)}</p>`;
    R.push(route("Craft it", c.default ? "Blueprint from the start" : c.missions.length ? plural(c.missions.length, "contract") : "", b));
  } else R.push(route("Craft it", "", `<p class="sub">Not craftable, as far as the item data shows.</p>`, true));
  if (h.ships && h.ships.length) R.push(route("Comes fitted on", plural(h.ships.length, "ship"), `<p class="shiplist">${h.ships.slice(0, 12).map(s => `<span class="chip tag">${esc(s)}</span>`).join("")}${h.ships.length > 12 ? `<span class="sub">and ${h.ships.length - 12} more</span>` : ""}</p>
    <p class="sub">Players often get parts like this by looting or salvaging those ships, or by taking them off one they own.</p>`));
  if (h.loot) R.push(route("Loot", "", `<p>Can turn up as loot.</p>`));
  if (h.events && h.events.length) R.push(route("Events", "", `<p>${h.events.map(e => esc(e.name || e)).join(", ")}</p>`));
  out += `<div class="routes">${R.join("")}</div>`;
  const sell = (h.sell || []).slice().sort((a, b) => b.sell - a.sell);
  if (sell.length) out += `<p class="sub">Sells for up to <b>${fmt(sell[0].sell)} aUEC</b> at ${esc(sell[0].terminal || sell[0].place)}.</p>`;
  if (h.url) out += `<p class="sub"><a href="${esc(h.url)}" target="_blank" rel="noopener">More on star-citizen.wiki ${ICON.ext}</a></p>`;
  return out + `</div>`;
}

async function drawOpts(key) {

  if (!S.optCache[ck]) {
    cell.innerHTML = `<p class="sub">Loading size ${esc(g.size)} options...</p>`;
    try { S.optCache[ck] = await api(`/api/options?type=${encodeURIComponent(g.item_type)}&size=${g.size}`); }
    catch (e) { cell.innerHTML = `<p class="sub">Couldn't load the options. ${esc(problem(e))}</p>`; return; }
  }
  const opts = S.optCache[ck];
  if (!opts.length) { cell.innerHTML = `<p class="sub">There are no size ${esc(g.size)} ${esc(g.label.toLowerCase())} options in the item data yet.</p>`; return; }
  const main = { Cooler: "coolant", PowerPlant: "power", Shield: "shield_hp" }[g.item_type];
  const mainLabel = { coolant: "Cooling", power: "Power", shield_hp: "Shield health" }[main];
  const fid = (g.fitted.id || "").toLowerCase(), sidd = ((g.stock && g.stock.id) || "").toLowerCase();
  const classes = [...new Set(opts.map(o => o.item_class).filter(Boolean))].sort();
  if (st.cls && !classes.includes(st.cls)) st.cls = "";
  const big = (v) => v == null ? -Infinity : v, small = (v) => v == null ? Infinity : v;
  const sorts = {
    best: (a, b) => (b.have - a.have) || (main ? big(b.stats[main]) - big(a.stats[main]) : 0) || (a.grade || "Z").localeCompare(b.grade || "Z") || a.name.localeCompare(b.name),
    main: (a, b) => big(b.stats[main]) - big(a.stats[main]),
    ir: (a, b) => small(a.stats.ir) - small(b.stats.ir),
    em: (a, b) => small(a.stats.em) - small(b.stats.em),
    price: (a, b) => small(a.cheapest) - small(b.cheapest),
    grade: (a, b) => (a.grade || "Z").localeCompare(b.grade || "Z") || a.name.localeCompare(b.name)
  };
  if (st.sort === "main" && !main) st.sort = "best";
  const list = opts.filter(o => (!st.cls || o.item_class === st.cls) && (!st.mine || o.have > 0) && (!st.sale || o.cheapest)).sort(sorts[st.sort]);
  const max = main ? Math.max(1, ...opts.map(o => o.stats[main] || 0)) : 1;
  const shown = st.all ? list : list.filter((o, j) => j < 8 || o.id === fid);
  const rows = shown.map(o => {
    const j = opts.indexOf(o), here = o.id === fid, isStock = o.id === sidd;

    return `<div class="orow${here ? " this" : ""}"><div class="on"><b>${esc(o.name)}</b><div class="meta">${here ? `<span class="chip edit">Fitted now</span>` : ""}${isStock ? `<span class="chip tag">Stock</span>` : ""}<span class="sub">${esc(o.maker || "")}</span><button class="link" type="button" data-ohow="${j}" aria-expanded="${howOpen}">${howOpen ? "Hide how to get it" : "How to get it"}</button></div></div>
      <div><span class="sm-lbl">Grade and class</span>${esc(o.grade || "")} <span class="sub">${esc(o.item_class || "")}</span></div>
      ${main ? `<div class="num"><span class="sm-lbl">${mainLabel}</span>${fmt(o.stats[main])}<span class="bar" aria-hidden="true"><i style="width:${Math.round((o.stats[main] || 0) / max * 100)}%"></i></span></div>` : ""}
      <div class="num"><span class="sm-lbl">IR</span>${fmt(o.stats.ir)}</div><div class="num"><span class="sm-lbl">EM</span>${fmt(o.stats.em)}</div>

      <div class="acts">${here ? "" : `<button class="btn ghost sm" type="button" data-fit="${j}">Plan this fit<span class="sr"> (${esc(o.name)})</span></button>`}</div></div>
      ${howOpen ? `<div class="ohow">${S.howCache[hk] ? `<h4 style="margin:0 0 8px">${esc(o.name)}</h4>` + howtoHtml(S.howCache[hk]) : `<p class="sub">Looking it up...</p>`}</div>` : ""}`;

      <label class="sel">Sort <select data-osort>${[["best", "Best match"], ...(main ? [["main", `Most ${mainLabel.toLowerCase()}`]] : []), ["ir", "Lowest IR"], ["em", "Lowest EM"], ["price", "Cheapest"], ["grade", "Grade"]].map(([v, l]) => `<option value="${v}" ${st.sort === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    </div></div>

  const all = cell.querySelector("[data-oall]"); if (all) all.onclick = () => { st.all = !st.all; redraw().then(() => { const x = cell.querySelector("[data-oall]"); if (x) x.focus(); }); };

  cell.querySelectorAll("[data-fit]").forEach(x => x.onclick = () => { const o = opts[+x.dataset.fit]; st.open = false;
    post("/api/ship_fit", { ship_id: +sid, slots: g.slots, item_id: o.id, item_name: o.name }); });
  cell.querySelectorAll("[data-ohow]").forEach(x => x.onclick = async () => {
    const o = opts[+x.dataset.ohow];
    st.how = st.how === o.id ? null : o.id; await redraw();
    const focusBack = () => { const y = cell.querySelector(`[data-ohow="${x.dataset.ohow}"]`); if (y) y.focus(); };
    focusBack();
    if (st.how === o.id && !S.howCache[`${o.id}|${o.name}`]) { try { await fetchHow(o.id, o.name); } catch (e) { toast(problem(e), true); } await redraw(); focusBack(); }
  });
}

function openItem(i, fk, quiet) {
  if (!i) return;
  S.open = { key: i.location_key, name: i.name };
  if (fk) S.opener = fk;
  const d = $("drawer"), keep = d.scrollTop;
  d.innerHTML = drawerHtml(i);
  d.classList.add("open"); d.removeAttribute("inert");
  $("shell").classList.add("has-panel"); updateModal();
  document.querySelectorAll("#view tr.row").forEach(tr => { const r = S.rows[+tr.dataset.i]; tr.classList.toggle("sel", !!r && r.location_key === i.location_key && r.name === i.name); });
  $("dclose").onclick = () => closeItem();
  let dir = -1;
  const def = "The next scan of this station replaces it with the kiosk's own count.";
  const delta = () => { const raw = $("adq").value.trim(), n = parseInt(raw, 10); if (!n) return 0; return /^[+-]/.test(raw) ? n : dir * Math.abs(n); };
  const prev = () => {
    const dl = delta(), p = $("adprev");
    if (!dl) { p.textContent = def; return; }
    const nt = i.qty + dl;
    p.innerHTML = nt < 0 ? `<span class="warnt">That's more than the ${fmt(i.qty)} recorded here.</span> Check the number, or rescan this station.` : `New total here: <b>${fmt(nt)}</b>. ${def}`;
  };
  d.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => { dir = +b.dataset.dir; d.querySelectorAll("[data-dir]").forEach(x => x.setAttribute("aria-pressed", x === b)); prev(); });
  $("adq").oninput = prev;
  const go = async () => {
    const q = delta();
    if (!q) { $("adq").focus(); return toast("Enter how many, e.g. 40."); }
    if (await post("/api/adjust", { location_key: i.location_key, name: i.name, id: i.id, delta: q, note: $("adn").value })) reopen();
  };
  $("adgo").onclick = go;
  [$("adq"), $("adn")].forEach(el => el.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); go(); } });
  $("ntgo").onclick = async () => {
    if (await post("/api/note", { name: i.name, note: $("nt").value, tags: $("tg").value.split(",").map(t => t.trim()).filter(Boolean) })) reopen();
  };
  d.querySelectorAll("[data-undo]").forEach(b => b.onclick = async () => { if (await post("/api/undo", { adjustment_id: +b.dataset.undo })) reopen(); });
  d.querySelectorAll("[data-also]").forEach(b => b.onclick = () => {
    const st = S.model.stations.find(s => s.name === b.dataset.also); if (!st) return;
    const it = S.model.items.find(x => x.location_key === st.key && x.name === i.name);
    S.station = st.key; closeRename(false); render(); if (it) openItem(it, `item:${it.location_key}|${it.name}`);
  });
  bindMore(d);
  if (quiet) d.scrollTop = keep; else { d.scrollTop = 0; $("dtitle").focus(); }
}
function reopen() {
  if (!S.open) return;
  const i = S.model.items.find(x => x.location_key === S.open.key && x.name === S.open.name);
  if (i) openItem(i); else closeItem();
}

function closeItem(focus = true) {

  renderRail(); fillTypes(); renderHead(); renderNeeds(); renderTabs();
  const t = S.tab;
  if (!(auto && ["wish", "ships", "settings", "tips", "links", "about"].includes(t))) {
    const tok = ++S.viewTok;
    const fail = e => { if (tok === S.viewTok) $("view").innerHTML = emptyState("Couldn't load this tab", `${esc(problem(e))}`, `<button class="btn ghost" type="button" data-retry>Try again</button>`); };
    try {
      if (t === "items" || t === "expired") renderItems();
      else if (t === "changes") renderChanges();
      else if (t === "wish") renderWish();
      else {
        const f = { tips: renderTips, ships: renderShips, links: renderLinks, about: renderAbout, settings: renderSettings }[t];
        if (f) f(tok).catch(fail);
      }
    } catch (e) { fail(e); }
  }
  if (fk) { const el = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }
}
$("rail").addEventListener("click", e => {
  const b = e.target.closest(".st"); if (!b) return;
  S.station = b.dataset.st; closeRename(false); closeItem(false); render();
});
$("tabs").addEventListener("click", e => { const b = e.target.closest("[role=tab]"); if (b) setTab(b.dataset.tab); });
$("tabs").addEventListener("keydown", e => {
  const tabs = [...$("tabs").querySelectorAll("[role=tab]")], i = tabs.indexOf(document.activeElement); if (i < 0) return;
  const n = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i - 1 + tabs.length) % tabs.length, Home: 0, End: tabs.length - 1 }[e.key];
  if (n != null) { e.preventDefault(); setTab(tabs[n].dataset.tab, true); tabs[n].focus(); }
});
$("view").addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return setTab(g.dataset.go);
  if (e.target.closest("[data-retry]")) return render();
  if (e.target.closest("[data-clear]")) { clearFilters(); $("q").focus(); return; }
  if (e.target.closest("[data-allst]")) { S.station = ""; render(); return; }
  const so = e.target.closest("[data-sort]");
  if (so) { const k = so.dataset.sort; if (S.sort === k) S.dir *= -1; else { S.sort = k; S.dir = 1; } $("fsort").value = k; render(); const b = $("view").querySelector(`[data-sort="${k}"]`); if (b) b.focus(); return; }
  const un = e.target.closest("[data-undo]"); if (un) return post("/api/undo", { adjustment_id: +un.dataset.undo });
  const co = e.target.closest("[data-chopen]");
  if (co) { const c = S.chRows[+co.dataset.chopen], it = S.model.items.find(i => i.location_key === c.location_key && i.name === c.item); if (it) { co.dataset.fk = `chg:${co.dataset.chopen}`; openItem(it, co.dataset.fk); } return; }
  const row = e.target.closest("tr.row");
  if (row && (!e.target.closest("button, a, input") || e.target.closest(".iname"))) { const it = S.rows[+row.dataset.i]; openItem(it, `item:${it.location_key}|${it.name}`); }
});
["ftype", "fchanged", "freg", "fspread", "fammo"].forEach(id => $(id).addEventListener("input", () => render()));
$("fsort").addEventListener("input", () => { S.sort = $("fsort").value; S.dir = 1; render(); });
$("fclear").onclick = () => { clearFilters(); $("q").focus(); };
$("q").addEventListener("input", () => { $("qclear").hidden = !$("q").value; if (S.tab !== "items" && S.tab !== "expired") S.tab = "items"; render(); });
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { const b = $("view").querySelector(".iname"); if (b && S.rows.length === 1) b.click(); } });
$("qclear").onclick = () => { $("q").value = ""; $("qclear").hidden = true; render(); $("q").focus(); };
$("scrim").onclick = () => closeItem();
dockMQ.addEventListener("change", updateModal);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !e.defaultPrevented) {
    const rb = $("renamebox");
    if (rb && rb.contains(document.activeElement)) return closeRename();
    if (S.open) return closeItem();
    if (rb) return closeRename();
    if (document.activeElement === $("q") && $("q").value) { $("q").value = ""; $("qclear").hidden = true; render(); }
  }
  if (e.key === "Tab" && S.open && !dockMQ.matches) {
    const f = [...$("drawer").querySelectorAll("button, a[href], input, textarea, select, summary, [tabindex='0']")].filter(x => !x.disabled && x.offsetParent !== null);
    if (f.length) { const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
  }
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey && !isTyping()) { e.preventDefault(); if (S.open && !dockMQ.matches) closeItem(false); $("q").focus(); $("q").select(); }
});
document.addEventListener("focusin", e => { S.editing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.target.id !== "q"; });
document.addEventListener("focusout", () => setTimeout(() => { if (!isTyping()) S.editing = false; }, 0));
if ($("ver").textContent.startsWith("__")) api("/api/about").then(a => { S.about = a; $("ver").textContent = a.version; }).catch(() => $("ver").textContent = "");
load();
setInterval(() => { if (!S.editing && !document.hidden) load(true); }, 15000);
</script>
</body>
</html>
