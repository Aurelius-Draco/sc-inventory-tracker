<style>
:root {

    --text: #111922; --muted: #4c5866; --amber: #965800; --on-amber: #ffffff; --teal: #0f7266; --rust: #a63f28; --fresh: #2f5f86;
    --amber-bg: rgba(150,88,0,.09); --amber-line: rgba(150,88,0,.45); --teal-bg: rgba(15,114,102,.09); --rust-bg: rgba(166,63,40,.09); --fresh-bg: rgba(47,95,134,.09);
    --tick: rgba(47,95,134,.45); --grid: rgba(47,95,134,.05); --field: #ffffff;

  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e6ebf0; --panel: #f5f7f9; --raise: #ffffff; --raise2: #edf1f5; --line: #cfd7df; --line2: #a9b5c1;
  --text: #111922; --muted: #4c5866; --amber: #965800; --on-amber: #ffffff; --teal: #0f7266; --rust: #a63f28; --fresh: #2f5f86;
  --amber-bg: rgba(150,88,0,.09); --amber-line: rgba(150,88,0,.45); --teal-bg: rgba(15,114,102,.09); --rust-bg: rgba(166,63,40,.09); --fresh-bg: rgba(47,95,134,.09);

* { box-sizing: border-box; }

  background: radial-gradient(1100px 560px at 12% -8%, var(--fresh-bg), transparent 62%), radial-gradient(900px 480px at 105% -4%, var(--amber-bg), transparent 60%), var(--bg); background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse at 40% 0%, #000 10%, transparent 75%); mask-image: radial-gradient(ellipse at 40% 0%, #000 10%, transparent 75%); }

/* Panels with corner marks, like a console bezel */
.frame { position: relative; background: var(--panel); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.03); }

  background-image: linear-gradient(var(--tick), var(--tick)), linear-gradient(var(--tick), var(--tick)), linear-gradient(var(--tick), var(--tick)), linear-gradient(var(--tick), var(--tick)),
    linear-gradient(var(--tick), var(--tick)), linear-gradient(var(--tick), var(--tick)), linear-gradient(var(--tick), var(--tick)), linear-gradient(var(--tick), var(--tick));
  background-size: 12px 1px, 1px 12px, 12px 1px, 1px 12px, 12px 1px, 1px 12px, 12px 1px, 1px 12px;
  background-position: 0 0, 0 0, 100% 0, 100% 0, 0 100%, 0 100%, 100% 100%, 100% 100%; }

/* Layout */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }

/* Station rail */

.st .q { color: var(--muted); font-size: .875rem; text-align: right; }

.meter i:nth-child(1) { height: 4px; } .meter i:nth-child(2) { height: 6px; } .meter i:nth-child(3) { height: 8px; } .meter i:nth-child(4) { height: 10px; } .meter i:nth-child(5) { height: 12px; }

.live.lost { color: var(--amber); } .live.lost i { background: var(--amber); box-shadow: none; }
.railnote { padding: 6px 12px; font-size: .8125rem; color: var(--muted); }
@keyframes breathe { 50% { opacity: .35; } }

/* Search */
.search { display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 10px 0 16px; background: var(--raise); border: 1px solid var(--line2); transition: border-color .15s, box-shadow .15s; }

.search input:focus { outline: none; }

.iconbtn:hover { color: var(--text); background: var(--raise2); }

/* Needs you */
.needs { margin-top: 18px; border-color: var(--amber-line); --tick: var(--amber); background: linear-gradient(90deg, var(--amber-bg), transparent 70%), var(--panel); }

.need { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }

.need select { max-width: 100%; min-width: 0; }
.needs .more { padding: 8px 16px 12px; border-top: 1px solid var(--line); }

/* Station header */
.head { margin-top: 18px; padding: 18px 22px 18px; display: grid; gap: 14px; overflow: hidden; }
.head::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(90deg, transparent, var(--fresh-bg) 45%, rgba(180,205,227,.16) 50%, var(--fresh-bg) 55%, transparent); background-size: 40% 100%; background-repeat: no-repeat; }

.cell.warn dd { color: var(--amber); } .cell.rust dd { color: var(--rust); }
.cell .sub { white-space: normal; }
.warns { display: grid; gap: 6px; }
.notice { display: flex; gap: 10px; align-items: flex-start; margin: 0; padding: 9px 12px; border: 1px solid var(--amber-line); background: var(--amber-bg); border-radius: 3px; font-size: .875rem; }
.notice > svg { flex: none; color: var(--amber); margin-top: 2px; }

.rename { margin-top: 10px; padding: 16px 20px; display: grid; gap: 12px; }
.rh { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }

.placelist { max-height: 300px; overflow-y: auto; border: 1px solid var(--line); max-width: 560px; background: var(--bg); }

.placelist button[aria-current="true"] { color: var(--amber); }

.tabbar { position: sticky; top: 0; z-index: 6; display: flex; gap: 2px; margin: 20px -32px 0; padding: 0 32px; overflow-x: auto; scrollbar-width: none;
  background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.tabbar::-webkit-scrollbar { display: none; }
.tabbar button { position: relative; flex: none; display: flex; align-items: center; gap: 7px; padding: 14px 13px 12px; background: none; border: 0; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tabbar button:hover { color: var(--text); }
.tabbar button[aria-selected="true"] { color: var(--text); }
.tabbar button[aria-selected="true"]::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: -1px; height: 2px; background: var(--amber); box-shadow: var(--glow); }

.tabbar .t2 { margin-left: auto; }
.tabbar .t2 ~ button { font-weight: 500; }
.count { font-size: .75rem; line-height: 1.6; min-width: 22px; padding: 0 6px; text-align: center; border-radius: 10px; background: var(--raise2); color: var(--muted); font-weight: 600; }
.count.teal { background: var(--teal-bg); color: var(--teal); } .count.rust { background: var(--rust-bg); color: var(--rust); }
.count:empty { display: none; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin: 14px 0 0; }
.sel { display: inline-flex; align-items: center; gap: 8px; font-size: .875rem; color: var(--muted); }
select, .inp, .field input, .field textarea, textarea { background: var(--field); border: 1px solid var(--line2); border-radius: 3px; padding: 7px 10px; color: var(--text); min-height: 38px; }
select { padding-right: 6px; }
select:focus, .inp:focus, .field input:focus, textarea:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber-line); }
.chipt { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 4px 13px 4px 10px; border: 1px solid var(--line2); border-radius: 999px; font-size: .875rem; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
.chipt:hover { color: var(--text); border-color: var(--amber-line); }
.chipt input { appearance: none; -webkit-appearance: none; flex: none; width: 15px; height: 15px; margin: 0; border: 1.5px solid var(--line2); border-radius: 3px; background: var(--field); }
.chipt input:checked { background: var(--amber); border-color: var(--amber); box-shadow: inset 0 0 0 2.5px var(--field); }
.chipt input:focus { outline: none; }
.chipt:has(input:checked) { color: var(--text); border-color: var(--amber-line); background: var(--amber-bg); }
.chipt:has(input:focus-visible) { outline: 2px solid var(--amber); outline-offset: 2px; }
.fend { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: .875rem; color: var(--muted); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 7px 16px; border: 1px solid var(--amber); border-radius: 3px; background: var(--amber); color: var(--on-amber); font-weight: 600; white-space: nowrap; transition: box-shadow .15s, filter .15s; }
.btn:hover { box-shadow: var(--glow); filter: brightness(1.06); }

.btn.ghost { background: var(--raise); color: var(--text); border-color: var(--line2); }
.btn.ghost:hover { border-color: var(--amber); box-shadow: none; }
.btn.sm { min-height: 32px; padding: 4px 12px; font-size: .875rem; }
.link { background: none; border: 0; padding: 2px 0; color: var(--teal); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-align: left; }
.link:hover { color: var(--text); }
.link.danger { color: var(--rust); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line2); border-radius: 3px; overflow: hidden; }

.seg button:focus-visible { outline-offset: -3px; }

/* Tables */
.tablewrap { margin-top: 12px; }
.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .8125rem; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line2); background: var(--raise); white-space: nowrap; }
th button { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 0; color: inherit; font: inherit; }
th button:hover, th[aria-sort] button { color: var(--text); }
th .arr { color: var(--amber); font-size: .7rem; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tr.row { cursor: pointer; }
table.items thead th { position: sticky; top: var(--tabh, 49px); z-index: 2; border-bottom: 0; padding-top: 12px; padding-bottom: 12px;
  background: var(--panel); color: var(--fresh); font-size: .875rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  box-shadow: inset 0 -2px 0 var(--amber), 0 4px 10px rgba(0,0,0,.18); }
table.items thead th button:hover, table.items thead th[aria-sort] button { color: var(--text); }
table.items td { padding: 12px 14px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); vertical-align: middle; }
table.items th { padding-left: 14px; padding-right: 14px; }
table.items tr.row td:first-child { box-shadow: inset 3px 0 0 transparent; transition: box-shadow .12s; }
table.items tr.row.alt td { background: color-mix(in srgb, var(--raise) 55%, transparent); }
tr.row:hover td { background: var(--raise2) !important; }
table.items tr.row:hover td:first-child { box-shadow: inset 3px 0 0 var(--amber-line); }
.c-qty { width: 1%; }
.c-qty .delta { display: block; width: max-content; margin: 4px 0 0 auto; }
.c-qty .qty { display: inline-block; min-width: 3.2em; padding: 2px 8px; border: 1px solid var(--line2); border-radius: 3px; background: var(--field); text-align: right; }
.c-val { width: 1%; }
.val { font-weight: 600; font-size: 1rem; }
.val small, .vsm small { color: var(--muted); }
.each { display: block; font-size: .75rem; color: var(--muted); margin-top: 1px; }
.noval { color: var(--line2); }
.vsm { margin-top: 4px; }
tr.gh th { position: static; padding: 0; background: var(--bg); border: 0; white-space: normal; }
tr.gh th > .ghbar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-top: 18px; padding: 10px 14px 9px 16px; position: relative;
  background: linear-gradient(90deg, var(--fresh-bg), transparent 75%), var(--raise2); border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line2); }
tr.gh th > .ghbar::before { content: ""; position: absolute; left: 0; top: -1px; bottom: -1px; width: 4px; background: var(--fresh); }
tr.gh:first-child th > .ghbar { margin-top: 0; border-top: 0; }
.ghn { font-size: 1.0625rem; font-weight: 700; font-stretch: condensed; color: var(--text); letter-spacing: .02em; }
.ghm { font-size: .8125rem; font-weight: 500; color: var(--muted); }
tr.row.sel td, table.items tr.row.sel.alt td { background: var(--amber-bg); }
tr.row.sel td:first-child { box-shadow: inset 3px 0 0 var(--amber); }
.iname { background: none; border: 0; padding: 0; text-align: left; font-weight: 600; font-size: 1rem; color: var(--text); overflow-wrap: anywhere; }
.iname:hover { color: var(--amber); }
.num { text-align: right; white-space: nowrap; }
th.num button { flex-direction: row-reverse; }
.qty { font-size: 1.125rem; font-weight: 600; }
.delta { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 3px; font-size: .75rem; font-weight: 600; vertical-align: 2px; }
.delta.up { color: var(--teal); background: var(--teal-bg); } .delta.down { color: var(--rust); background: var(--rust-bg); }
.chip { display: inline-flex; align-items: center; font-size: .75rem; line-height: 1.55; padding: 0 7px; border-radius: 3px; font-weight: 600; white-space: nowrap; }
.chip.reg { color: var(--fresh); background: var(--fresh-bg); }
.chip.exp { color: var(--rust); background: var(--rust-bg); }
.chip.edit { color: var(--amber); background: var(--amber-bg); }
.chip.log { color: var(--teal); background: var(--teal-bg); }

  --bg: #f3ead8; --panel: #fbf5ea; --raise: #fffaf2; --raise2: #f1e6d1; --line: #e2d4bb; --line2: #c2ae8d;
  --text: #1a1c40; --muted: #55557a; --amber: #9a5000; --on-amber: #ffffff; --teal: #00766a; --rust: #b3341f; --fresh: #3447a6;
  --amber-bg: rgba(154,80,0,.09); --amber-line: rgba(154,80,0,.45); --teal-bg: rgba(0,118,106,.09); --rust-bg: rgba(179,52,31,.09); --fresh-bg: rgba(52,71,166,.08);
  --field: #fffdf8; --star: rgba(26,28,64,.22); --star2: rgba(52,71,166,.18); --shadow: 0 18px 40px rgba(60,40,10,.14); --glow: 0 0 0 transparent; --cosmos: .38;
}

/* Sky: drifting stars and a ringed planet behind everything */
body { background: radial-gradient(1300px 700px at 88% -18%, var(--fresh-bg), transparent 62%), radial-gradient(900px 620px at -8% 112%, var(--rust-bg), transparent 60%), var(--bg); background-attachment: fixed; }
body::before, body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; -webkit-mask-image: none; mask-image: none; background-size: 360px 360px; }
body::before { background-image:
  radial-gradient(circle at 24px 36px, var(--star) 0 1px, transparent 1.6px), radial-gradient(circle at 132px 88px, var(--star2) 0 1px, transparent 1.6px),
  radial-gradient(circle at 210px 170px, var(--star) 0 1.3px, transparent 2px), radial-gradient(circle at 318px 44px, var(--star2) 0 .8px, transparent 1.4px),
  radial-gradient(circle at 74px 250px, var(--star) 0 .9px, transparent 1.5px), radial-gradient(circle at 280px 300px, var(--star2) 0 1px, transparent 1.6px),
  radial-gradient(circle at 170px 330px, var(--star) 0 .7px, transparent 1.3px);
  animation: drift 260s linear infinite; }
body::after { background-size: 560px 560px; opacity: .7; background-image:
  radial-gradient(circle at 60px 120px, var(--star) 0 1.6px, transparent 2.4px), radial-gradient(circle at 400px 60px, var(--star2) 0 1.2px, transparent 2px),
  radial-gradient(circle at 300px 420px, var(--star) 0 1.4px, transparent 2.2px), radial-gradient(circle at 500px 300px, var(--star2) 0 1px, transparent 1.8px);
  animation: drift2 420s linear infinite, twinkle 7s ease-in-out infinite; }
@keyframes drift { to { background-position: 360px 0; } }
@keyframes drift2 { to { background-position: 560px 0; } }
@keyframes twinkle { 50% { opacity: .35; } }
.cosmos { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; opacity: var(--cosmos); }
.planet { position: absolute; width: 640px; height: 640px; right: -200px; top: -260px; border-radius: 50%;
  background: radial-gradient(circle at 32% 72%, #ffd38a 0%, #ff9a5c 22%, #e2546a 44%, #6a2b86 68%, #20144a 88%);
  box-shadow: 0 0 120px rgba(255,140,100,.35), inset -40px -30px 80px rgba(10,6,40,.55); }
.planet::after { content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: .25; mix-blend-mode: soft-light;
  background: repeating-linear-gradient(-18deg, transparent 0 22px, rgba(255,255,255,.6) 22px 30px, transparent 30px 52px); background-size: 200% 100%; animation: bands 90s linear infinite; }
@keyframes bands { to { background-position: -200% 0; } }
.ring { position: absolute; width: 1180px; height: 220px; right: -470px; top: -40px; border-radius: 50%; transform: rotate(-16deg);
  border: 2px solid rgba(255,205,160,.45); box-shadow: 0 0 0 10px rgba(255,205,160,.06), 0 0 0 22px rgba(255,205,160,.04); }
.ring::after { content: ""; position: absolute; inset: 26px 70px; border-radius: 50%; border: 1px dashed rgba(149,183,255,.45); }
.moon { position: absolute; width: 22px; height: 22px; border-radius: 50%; right: 520px; top: 120px; background: radial-gradient(circle at 35% 35%, #fff4dc, #b9b7d4 60%, #4b4a7a); box-shadow: 0 0 18px rgba(255,240,210,.4); animation: bob 14s ease-in-out infinite; }
@keyframes bob { 50% { transform: translate(-14px, 10px); } }

/* Panels */
.frame { border-radius: 16px; border-color: var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  background: linear-gradient(180deg, color-mix(in srgb, color-mix(in srgb, var(--raise) 55%, var(--panel)) 80%, transparent), color-mix(in srgb, var(--panel) 84%, transparent)); box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 10px 30px rgba(2,3,15,.18); }
.frame::before { display: none; }
.iname::after { content: "\203A"; display: inline-block; margin-left: 6px; color: var(--amber); opacity: 0; transform: translateX(-4px); transition: opacity .15s, transform .15s; }
tr.row:hover .iname::after, .iname:focus-visible::after { opacity: 1; transform: none; }

/* Rail */
.rail { background: color-mix(in srgb, var(--panel) 86%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.mark { width: 36px; height: 36px; position: relative; }
.mark svg { display: none; }
.mark::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe3a1, var(--amber) 40%, var(--rust) 85%); box-shadow: 0 0 14px rgba(255,178,46,.45); }
.mark::after { content: ""; position: absolute; left: -6px; right: -6px; top: 13px; height: 10px; border-radius: 50%; border: 2px solid var(--fresh); transform: rotate(-20deg); border-bottom-color: transparent; }
.brand h1 { font-size: 1.375rem; letter-spacing: .03em; }
.sys h2 { color: var(--text); letter-spacing: .2em; }
.sys h2::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--fresh); box-shadow: 0 0 0 3px var(--panel), 0 0 0 4px var(--line2); }
.sys[aria-label="Stanton"] h2::before { background: radial-gradient(circle at 35% 35%, #fff2c8, #ffb22e 60%, #c76a10); }
.sys[aria-label="Pyro"] h2::before { background: radial-gradient(circle at 35% 35%, #ffd0b0, #ff7360 60%, #9c2b22); }
.sys[aria-label="Nyx"] h2::before { background: radial-gradient(circle at 35% 35%, #e4d8ff, #9a7bff 60%, #4a2fa0); }
.st { border-radius: 12px; padding: 10px 12px 10px 14px; }
.st:hover { background: var(--raise); }
.st[aria-current="true"] { background: linear-gradient(90deg, var(--amber-bg), transparent 85%), var(--raise); border-color: var(--amber-line); }
.st[aria-current="true"]::before { left: -1px; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; }
.meter i { border-radius: 2px; }
.rail-foot { border-top-color: var(--line); }

/* Search */
.search { height: 62px; padding: 0 14px 0 22px; border-radius: 999px; border: 1.5px solid var(--line2); background: var(--field); box-shadow: 0 8px 30px rgba(2,3,15,.25); }
.search:focus-within { border-color: var(--amber); box-shadow: 0 0 0 4px var(--amber-bg), 0 0 34px rgba(255,178,46,.22); }
.search input { font-size: 1.5rem; }
kbd { border-radius: 6px; }
.iconbtn { border-radius: 999px; }

/* Needs you: hazard band on top */
.needs { border-radius: 16px; overflow: hidden; }
.needs::before { display: block; inset: 0 0 auto 0; height: 5px; background: repeating-linear-gradient(-45deg, var(--amber) 0 10px, transparent 10px 20px); opacity: .9; }
.needs-h { padding-top: 16px; }

/* Station header: orbit rings with a moon going round */
.head { border-radius: 22px; padding: 22px 26px; background: radial-gradient(520px 260px at 100% 100%, var(--fresh-bg), transparent 70%), linear-gradient(180deg, color-mix(in srgb, var(--raise) 78%, transparent), color-mix(in srgb, var(--panel) 84%, transparent)); }
.head::before { display: block; inset: auto -110px -170px auto; width: 380px; height: 380px; border-radius: 50%; opacity: .9;
  background: radial-gradient(circle at 50% 4.5%, var(--amber) 0 5px, transparent 6px), repeating-radial-gradient(circle, transparent 0 34px, var(--line2) 34px 35px);
  animation: orbit 50s linear infinite; }
@keyframes orbit { to { transform: rotate(360deg); } }
.hmain, .readout, .warns { position: relative; z-index: 1; }
.hmain h2 { font-size: 2.5rem; letter-spacing: .01em; }
.eyebrow .sysname { color: var(--amber); }
.readout { gap: 10px; }
.cell { padding: 9px 16px 10px; border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--field) 70%, transparent); }
.cell dt { text-transform: uppercase; letter-spacing: .1em; font-size: .6875rem; font-weight: 600; }
.cell dd { font-size: 1.375rem; }
.notice { border-radius: 12px; }
.rename { border-radius: 16px; }
.placelist, .sugg { border-radius: 12px; }

/* Tabs as pills */
.tabbar { gap: 6px; padding-top: 10px; padding-bottom: 10px; background: color-mix(in srgb, var(--bg) 82%, transparent); }
.tabbar button { padding: 8px 16px; border-radius: 999px; border: 1px solid transparent; }
.tabbar button:hover { background: var(--raise); border-color: var(--line); }
.tabbar button[aria-selected="true"] { background: var(--amber); color: var(--on-amber); box-shadow: var(--glow); }
.tabbar button[aria-selected="true"]::after { display: none; }
.tabbar button[aria-selected="true"] .count { background: rgba(0,0,0,.18); color: var(--on-amber); }
.tabbar button:focus-visible { outline-offset: 2px; }

/* Controls */
select, .inp, .field input, .field textarea, textarea { border-radius: 10px; }
.btn { border-radius: 999px; padding-left: 20px; padding-right: 20px; box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
.btn:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), var(--glow); }
.btn.ghost { box-shadow: none; }
.seg { border-radius: 999px; }
.seg button[aria-pressed="true"] { background: var(--amber); color: var(--on-amber); box-shadow: none; }
.chip { border-radius: 999px; padding: 0 9px; }

/* Items table */
.tablewrap { border-radius: 18px; }
table.items thead th { background: var(--raise); }
table.items thead th:first-child { border-top-left-radius: 17px; }
table.items thead th:last-child { border-top-right-radius: 17px; }
table.items tr.row.alt td { background: color-mix(in srgb, var(--raise) 45%, transparent); }
tr.row:hover td { background: linear-gradient(90deg, var(--amber-bg), transparent 70%), var(--raise) !important; }
.c-qty .qty { border-radius: 999px; padding: 2px 12px; }
tr.gh th > .ghbar { margin: 16px 10px 4px; padding: 9px 16px 9px 40px; border: 1px solid var(--line); border-radius: 999px; background: linear-gradient(90deg, var(--fresh-bg), transparent 80%), var(--raise2); }
tr.gh:first-child th > .ghbar { margin-top: 10px; border-top: 1px solid var(--line); }
tr.gh th > .ghbar::before { left: 15px; top: 50%; bottom: auto; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, var(--fresh) 60%); box-shadow: 0 0 0 3px var(--raise2), 0 0 0 4px var(--fresh); }
.ghn { font-size: 1.125rem; }

/* Changes, wish list, ships, cards */
.chgs { border-radius: 16px; }
.route { border-radius: 14px; border-top-width: 3px; }
.preview, .howbox { border-radius: 14px; }
.howbox { margin: 0 12px 10px; border: 1px solid var(--line); }
.prog { border-radius: 999px; height: 7px; } .prog i { background: linear-gradient(90deg, var(--teal), var(--fresh)); border-radius: 999px; }
.wl, .ship, .card, .set, .about, .addcard { border-radius: 18px; }
/* keep suggestion lists above the cards that follow (backdrop-filter makes each card its own layer) */
.addcard, .field:focus-within { position: relative; z-index: 8; }
.grp > h4 { background: transparent; color: var(--amber); }
.shipname { font-size: 1.5rem; }
.opts { border-radius: 0 0 14px 14px; }
.olist { border-radius: 14px; overflow: hidden; }
.size { border-radius: 999px; }
.idx { display: inline-grid; place-items: center; min-width: 30px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--amber); color: var(--on-amber); }

/* Item panel */
.drawer { border-radius: 24px 0 0 24px; border-left: 1px solid var(--line2); }
.dh { border-radius: 24px 0 0 0; background: radial-gradient(420px 150px at 100% 0%, var(--rust-bg), transparent 70%), radial-gradient(380px 140px at 0% 0%, var(--fresh-bg), transparent 70%), var(--panel); }
.dh::after { height: 2px; background: linear-gradient(90deg, var(--amber), var(--rust) 40%, transparent 80%); opacity: 1; }
.big b { font-size: 3.5rem; background: linear-gradient(180deg, var(--text), color-mix(in srgb, var(--text) 60%, var(--amber))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.scrim { background: rgba(5,4,25,.6); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }

/* Empty state: a little ringed planet */
.empty { border-radius: 18px; border-style: dashed; }
.ering { width: 54px; height: 54px; border: 0; background: radial-gradient(circle at 34% 30%, #ffe3a1, var(--amber) 38%, var(--rust) 80%); box-shadow: 0 0 24px rgba(255,178,46,.35); }
.ering::after { inset: auto; left: -18px; right: -18px; top: 20px; height: 14px; border: 2px solid var(--fresh); border-radius: 50%; transform: rotate(-18deg); border-bottom-color: transparent; }

/* Toast */
.toast { border-radius: 999px; border-left: 1px solid var(--line2); padding: 11px 22px 11px 38px; }
.toast::before { content: ""; position: absolute; left: 16px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 10px var(--teal); }
.toast.err::before { background: var(--rust); box-shadow: 0 0 10px var(--rust); }
@media (max-width: 900px) { .planet { width: 380px; height: 380px; right: -170px; top: -230px; } .ring { width: 700px; right: -330px; top: -120px; } .moon { display: none; } .hmain h2 { font-size: 1.875rem; } .drawer { border-radius: 0; } .dh { border-radius: 0; } }
@media (prefers-reduced-motion: reduce) { .head::before, .planet::after, .moon { animation: none !important; } }
</style>
</head>
<body>
<div class="cosmos" aria-hidden="true"><div class="ring"></div><div class="planet"></div><div class="moon"></div></div>
<a class="skip" href="#view">Skip to the list</a>
<div class="shell" id="shell">
  <aside class="rail" aria-label="Stations">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.6"><polygon points="17,2 30,9.5 30,24.5 17,32 4,24.5 4,9.5"/><rect x="11" y="12" width="12" height="10"/><path d="M11 17h12"/></svg></span>
      <div><h1>Storage manifest</h1><p>SC Inventory Tracker <span id="ver">__VERSION__</span></p></div>
    </div>
    <nav class="stlist" id="rail" aria-label="Choose a station"></nav>
    <div class="rail-foot" id="railfoot"></div>
  </aside>
  <main id="main">
    <div class="search" role="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <label class="sr" for="q">Find an item</label>
      <input id="q" type="search" placeholder="Find an item, maker, type, tag or note" autocomplete="off" spellcheck="false">
      <button class="iconbtn" id="qclear" type="button" aria-label="Clear search" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <kbd title="Press / from anywhere to search">/</kbd>
    </div>
    <div id="needs"></div>
    <div class="head frame" id="head"></div>
    <div class="tabbar" role="tablist" id="tabs" aria-label="Sections">
      <button role="tab" id="tab-items" data-tab="items" aria-controls="view" aria-selected="true">Items <span class="count" id="c-items"></span></button>
      <button role="tab" id="tab-changes" data-tab="changes" aria-controls="view" aria-selected="false" tabindex="-1">Changes <span class="count teal" id="c-changes"></span></button>
      <button role="tab" id="tab-expired" data-tab="expired" aria-controls="view" aria-selected="false" tabindex="-1">Expired <span class="count rust" id="c-expired"></span></button>
      <button role="tab" id="tab-wish" data-tab="wish" aria-controls="view" aria-selected="false" tabindex="-1">Wish list <span class="count" id="c-wish"></span></button>
      <button role="tab" id="tab-ships" data-tab="ships" aria-controls="view" aria-selected="false" tabindex="-1">Ships</button>
      <button role="tab" id="tab-tips" data-tab="tips" aria-controls="view" aria-selected="false" tabindex="-1" class="t2">Tips</button>
      <button role="tab" id="tab-links" data-tab="links" aria-controls="view" aria-selected="false" tabindex="-1">Links</button>
      <button role="tab" id="tab-settings" data-tab="settings" aria-controls="view" aria-selected="false" tabindex="-1">Settings</button>
      <button role="tab" id="tab-about" data-tab="about" aria-controls="view" aria-selected="false" tabindex="-1">About</button>
    </div>
    <div class="filters" id="filters">
      <label class="sel">Type <select id="ftype"><option value="">Any</option></select></label>
      <label class="sel">Sort by <select id="fsort">
        <option value="name">Name</option><option value="qty">Quantity</option><option value="value">Value</option>
        <option value="changed">Recently changed</option><option value="station">Station</option><option value="type" selected>Type</option>
      </select></label>
      <label class="chipt"><input type="checkbox" id="fchanged"> Changed since the scan</label>
      <label class="chipt"><input type="checkbox" id="freg"> Registered to you</label>
      <label class="chipt"><input type="checkbox" id="fspread"> At more than one station</label>
      <label class="chipt"><input type="checkbox" id="fammo" checked> Hide magazines and batteries</label>
      <div class="fend"><span id="fcount" aria-live="polite"></span><button class="link" id="fclear" type="button" hidden>Clear filters</button></div>
    </div>
    <section id="view" role="tabpanel" aria-labelledby="tab-items" tabindex="-1"></section>
  </main>
  <aside class="drawer" id="drawer" aria-labelledby="dtitle" inert></aside>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>


<script>
const TOKEN = "__TOKEN__";
const S = { model: null, station: "", tab: "items", sort: "type", dir: 1, open: null, opener: null, tips: null, settings: null, links: null, about: null, ships: null,
  editing: false, viewTok: 0, last: "", shipOpen: {}, opt: {}, optCache: {}, want: {}, wishOpen: {}, howCache: {}, needSel: {}, needsAll: false, wishList: "", rows: [] };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => n == null || n === "" ? "" : Math.round(n).toLocaleString();
const signed = (n) => (n > 0 ? "+" : n < 0 ? "\u2212" : "") + fmt(Math.abs(n));
const plural = (n, one, many) => `${fmt(n)} ${n === 1 ? one : (many || one + "s")}`;
const ago = (ts) => {
  if (!ts) return "";
  const m = (Date.now() / 1000 - ts) / 60;
  if (m < 2) return "just now";
  if (m < 60) return `${Math.round(m)} min ago`;
  if (m < 1440) return `${Math.round(m / 60)} h ago`;
  if (m < 2880) return "yesterday";
  return `${Math.round(m / 1440)} days ago`;
};
const when = (ts) => new Date(ts * 1000).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
const dayLabel = (ts) => {
  const d = new Date(ts * 1000), t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((t - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  if (diff === 0) return "Today"; if (diff === 1) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
};
const daysSince = (s) => { const t = Date.parse(s); return isNaN(t) ? null : (Date.now() - t) / 864e5; };
const prettyDate = (s) => { const t = Date.parse(s); return isNaN(t) ? s : new Date(t).toLocaleDateString(undefined, { day: "numeric", month: "short" }); };
const HIDE_AMMO = /^(magazine|battery|bat)$/i;
const SYS_ORDER = ["Stanton", "Pyro", "Nyx"];
const ICON = {
  x: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  warn: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>`,
  check: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>`,
  chev: `<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`,
  ext: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>`
};
const emptyState = (t, p, a = "") => `<div class="empty"><span class="ering" aria-hidden="true"></span><h3>${t}</h3><p>${p}</p>${a ? `<div class="eacts">${a}</div>` : ""}</div>`;
const readout = (cells) => `<dl class="readout">${cells.map(([l, v, t, tone]) => `<div class="cell${tone ? " " + tone : ""}"${t ? ` title="${esc(t)}"` : ""}><dt>${l}</dt><dd>${v}</dd></div>`).join("")}</dl>`;
const notice = (b, t, cls = "") => `<p class="notice ${cls}">${ICON.warn}<span><b>${b}</b> ${t}</span></p>`;
const isTyping = () => { const a = document.activeElement; return !!a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable); };
const dockMQ = window.matchMedia("(min-width: 1500px)");

async function api(path, body) {
  const opt = { headers: { "X-Token": TOKEN } };
  if (body) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}
function toast(msg, err) {
  const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !!err); t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), err ? 5000 : 2800);
}
const problem = (e) => e instanceof TypeError ? "Can't reach the tracker. Check it's still running, then try again." : e.message;
async function post(path, body) {
  try {
    const j = await api(path, body);
    if (j.model) { S.model = j.model; S.last = JSON.stringify(j.model); }
    S.howCache = {};
    toast(j.message || "Saved."); render(); return true;
  } catch (e) { toast(problem(e), true); return false; }
}
async function load(auto) {
  try {
    const m = await api("/api/model");
    const sig = JSON.stringify(m);
    renderFoot(true, m);
    if (auto && sig === S.last) return;
    const first = !S.model;
    S.last = sig; S.model = m; render(auto);
    if (!first) { const h = $("head"); h.classList.remove("sweep"); void h.offsetWidth; h.classList.add("sweep"); }
    if (auto && S.open && !$("drawer").contains(document.activeElement)) refreshOpen();
  } catch (e) {
    if (S.model) { renderFoot(false, S.model); return; }
    $("view").innerHTML = emptyState("Can't reach the tracker", `Check the tracker window is still open, then reload this page. <span class="sub">(${esc(e.message)})</span>`, `<button class="btn" type="button" onclick="location.reload()">Reload the page</button>`);
  }
}
function renderFoot(ok, m) {
  const gen = Date.parse(m.generated);
  $("railfoot").innerHTML = `<div class="live${ok ? "" : " lost"}"><i aria-hidden="true"></i>${ok ? `Up to date${isNaN(gen) ? "" : `, ${clock(gen / 1000)}`}` : "Lost touch with the tracker. Retrying..."}</div>
    ${m.game_version ? `<div>Game version ${esc(m.game_version)}</div>` : ""}`;
}

/* ---------- stations ---------- */
const freshLevel = (age) => age == null ? 0 : age < 1 ? 5 : age < 3 ? 4 : age < 7 ? 3 : age < 14 ? 2 : 1;
const meter = (age) => { const l = freshLevel(age); return `<span class="meter${age > 7 ? " old" : ""}" aria-hidden="true">${[1, 2, 3, 4, 5].map(k => `<i class="${k <= l ? "on" : ""}"></i>`).join("")}</span>`; };
function stationNote(s) {
  const sc = s.scan;
  if (!sc) return { warn: true, text: "Not scanned yet, log changes only" };
  if (sc.before_patch) return { warn: true, text: "Scanned before the last patch" };
  if (s.untracked_changes) return { warn: true, text: "Changed outside the log, rescan" };
  if (sc.repeat_warning) return { warn: true, text: "Kiosk listed items twice, rescan" };
  if (!sc.complete) return { warn: true, text: "Scan not finished" };
  return { warn: s.age_days > 7, text: `Scanned ${ago(sc.last)}` };
}
function systems() {
  const by = {};
  for (const s of S.model.stations) (by[s.system || "Other"] ||= []).push(s);
  const rank = (k) => { const i = SYS_ORDER.indexOf(k); return i < 0 ? 99 : i; };
  return Object.entries(by).sort((a, b) => rank(a[0]) - rank(b[0]) || a[0].localeCompare(b[0]));
}
function renderRail() {
  const m = S.model, total = m.items.reduce((a, i) => a + i.qty, 0);
  let h = `<button class="st" type="button" data-st="" data-fk="st:" aria-current="${S.station === ""}">
    <span class="nm">All stations</span><span class="q">${fmt(total)}</span><span class="fr">${plural(m.stations.length, "station")}</span></button>`;
  for (const [sys, list] of systems()) {
    h += `<div class="sys" role="group" aria-label="${esc(sys)}"><h2>${esc(sys)}</h2>`;
    for (const s of list) {
      const n = stationNote(s);
      h += `<button class="st" type="button" data-st="${esc(s.key)}" data-fk="st:${esc(s.key)}" aria-current="${S.station === s.key}" title="${esc(s.name)}">
        <span class="nm">${esc(s.name)}</span><span class="q"><span class="sr">Items: </span>${fmt(s.qty)}</span>
        <span class="fr${n.warn ? " warn" : ""}">${meter(s.age_days)}<span>${esc(n.text)}</span></span></button>`;
    }
    h += `</div>`;
  }
  if (!m.stations.length) h += `<p class="railnote">Stations appear here after your first scan.</p>`;
  $("rail").innerHTML = h;
}

/* ---------- filters ---------- */
const SORTS = {
  name: [(a, b) => a.name.localeCompare(b.name), 1],
  qty: [(a, b) => S.tab === "expired" ? a.expired - b.expired : a.qty - b.qty, -1],
  value: [(a, b) => (a.value || 0) - (b.value || 0), -1],
  changed: [(a, b) => (a.last_change || 0) - (b.last_change || 0), -1],
  station: [(a, b) => (a.location || "").localeCompare(b.location || "") || a.name.localeCompare(b.name), 1],
  type: [(a, b) => (a.item_type || "\uffff").localeCompare(b.item_type || "\uffff") || a.name.localeCompare(b.name), 1]
};
function filtered(station = S.station, bare = false) {
  const q = $("q").value.trim().toLowerCase(), type = $("ftype").value;
  let rows = S.model.items.filter(i => !station || i.location_key === station);
  if (S.tab === "expired") rows = rows.filter(i => i.expired > 0);
  else rows = rows.filter(i => i.qty > 0 || i.changed);
  if (bare) return rows;
  if ($("fammo").checked && S.tab !== "expired") rows = rows.filter(i => !HIDE_AMMO.test(i.item_type || ""));
  if (type) rows = rows.filter(i => (i.item_type || "Unknown") === type);
  if ($("fchanged").checked) rows = rows.filter(i => i.changed);
  if ($("freg").checked) rows = rows.filter(i => i.registered > 0);
  if ($("fspread").checked) rows = rows.filter(i => i.also_at.length);
  if (q) rows = rows.filter(i => [i.name, i.manufacturer, i.item_type, i.item_class, i.location, i.note, ...(i.tags || [])]
      .some(v => (v || "").toLowerCase().includes(q)));
  const [by, d] = SORTS[S.sort] || SORTS.name;
  return rows.sort((a, b) => by(a, b) * d * S.dir || a.name.localeCompare(b.name));
}
const filtersActive = () => !!($("q").value.trim() || $("ftype").value || $("fchanged").checked || $("freg").checked || $("fspread").checked);
function clearFilters() {
  $("q").value = ""; $("qclear").hidden = true; $("ftype").value = "";
  ["fchanged", "freg", "fspread"].forEach(id => $(id).checked = false);
  render();
}
function fillTypes() {
  const sel = $("ftype"), cur = sel.value, n = {};
  for (const i of S.model.items) if ((!S.station || i.location_key === S.station) && i.qty > 0) { const t = i.item_type || "Unknown"; n[t] = (n[t] || 0) + 1; }
  const types = Object.keys(n).sort();
  if (cur && !n[cur]) { types.push(cur); n[cur] = 0; }
  sel.innerHTML = `<option value="">Any</option>` + types.map(t => `<option value="${esc(t)}" ${t === cur ? "selected" : ""}>${esc(t)} (${n[t]})</option>`).join("");
}

/* ---------- header ---------- */
function renderHead() {
  const m = S.model;
  if (!S.station) {
    const value = m.items.reduce((a, i) => a + (i.value || 0), 0);
    const kinds = m.items.filter(i => i.qty > 0).length, total = m.items.reduce((a, i) => a + i.qty, 0);
    const oldest = m.stations.filter(s => s.age_days != null && s.scan).sort((a, b) => b.age_days - a.age_days)[0];
    const unscanned = m.stations.filter(s => !s.scan).length;
    const cells = [["Different items", fmt(kinds)], ["In storage", fmt(total)], ["Stations", fmt(m.stations.length)]];
    if (value) cells.push(["Worth about", `${fmt(value)} <small>aUEC</small>`, "At the best sell prices players have reported"]);
    if (oldest) cells.push(["Oldest scan", `${meter(oldest.age_days)} ${ago(oldest.scan.last)}`, oldest.name, oldest.age_days > 7 ? "warn" : ""]);
    $("head").innerHTML = `<div class="hmain"><div><div class="eyebrow">Every station</div><h2>Everything you have stored</h2></div></div>${readout(cells)}
      ${unscanned ? `<div class="warns">${notice(`${plural(unscanned, "station")} not scanned yet.`, "Their counts come from the game log only. Scan them next time you're there.")}</div>` : ""}`;
    return;
  }
  const s = m.stations.find(x => x.key === S.station);
  if (!s) { S.station = ""; return renderHead(); }
  const sc = s.scan, warns = [], cells = [];
  if (sc) {
    cells.push(["Last scan", `${meter(s.age_days)} ${ago(sc.last)}`, when(sc.last), s.age_days > 7 ? "warn" : ""]);
    cells.push(["Kiosk tiles read", `${fmt(sc.identified)}${sc.total ? ` <small>of ${fmt(sc.total)}</small>` : ""}`]);
    if (!sc.complete) warns.push(["Scan not finished.", "Open the kiosk again and press Stack to scan the whole list."]);
    if (sc.newer_partial) warns.push(["A newer scan was started but not finished.", "These counts come from the last complete scan. Finish a full scan next time you're here."]);
    if (sc.before_patch) warns.push(["Scanned before the current game version.", "Patches can change storage, so rescan when you're next here."]);
    if (sc.repeat_warning) warns.push(["The kiosk listed some items twice.", "Close and reopen the kiosk, then scan again."]);
  } else warns.push(["Not scanned yet.", "You're seeing only what the game log picked up. Open the storage kiosk here and press Stack to scan."]);
  cells.push(["Changes since scan", fmt(s.changes || 0)]);
  if (s.expired) cells.push(["Expired", fmt(s.expired), "", "rust"]);
  if (s.value) cells.push(["Worth about", `${fmt(s.value)} <small>aUEC</small>`, "At the best sell prices players have reported"]);
  if (s.untracked_changes) warns.push(["Storage changed in ways the log can't show.", "The freight elevator is the usual cause. Rescan to be sure."]);
  $("head").innerHTML = `<div class="hmain"><div><div class="eyebrow"><span class="sysname">${esc(s.system)}</span><span>Station</span></div><h2>${esc(s.name)}</h2></div>
      <button class="link" type="button" id="rename" aria-expanded="${!!$("renamebox")}" aria-controls="renamebox">Wrong name? Rename it</button></div>
    ${readout(cells)}${warns.length ? `<div class="warns">${warns.map(w => notice(w[0], w[1])).join("")}</div>` : ""}`;
  $("rename").onclick = () => openRename(s);
}
async function openRename(s) {
  if ($("renamebox")) return closeRename();
  let all;
  try { all = await api(`/api/places?key=${encodeURIComponent(s.key)}`); }
  catch (e) { return toast("Couldn't load the place names. " + problem(e), true); }
  const box = document.createElement("div"); box.id = "renamebox"; box.className = "frame rename";
  box.innerHTML = `<div class="rh"><div><h3>Rename this station</h3><p class="sub">Pick its real name from the game's own place names. The closest matches are at the top.</p></div>
      <button class="iconbtn" type="button" id="rclose" aria-label="Close without renaming">${ICON.x}</button></div>
    <div class="field" style="max-width:560px"><label for="rq">Filter the names</label><input id="rq" placeholder="e.g. Alpha or Gateway" autocomplete="off"></div>
    <div class="placelist" id="rlist"></div>
    <p class="sub" style="margin:0">Game id: <code>${esc(s.key)}</code></p>`;
  $("head").after(box);
  const draw = () => {
    const q = $("rq").value.trim().toLowerCase(), hits = all.filter(n => !q || n.toLowerCase().includes(q));
    $("rlist").innerHTML = hits.length ? hits.slice(0, 60).map(n => `<button type="button" data-n="${esc(n)}" aria-current="${n === s.name}">${esc(n)}${n === s.name ? `<span class="sub">Current name</span>` : ""}</button>`).join("")
      + (hits.length > 60 ? `<p class="sub" style="padding:8px 12px;margin:0">Showing 60 of ${hits.length}. Type more to narrow it down.</p>` : "")
      : `<p class="sub" style="padding:10px 12px;margin:0">No names match. Try fewer letters.</p>`;
  };
  draw(); $("rq").oninput = draw; $("rq").focus();
  $("rclose").onclick = closeRename;
  if ($("rename")) $("rename").setAttribute("aria-expanded", "true");
  $("rlist").onclick = e => { const b = e.target.closest("button"); if (!b) return; post("/api/station_name", { key: s.key, name: b.dataset.n }); closeRename(); };
}
function closeRename(focus = true) {
  const b = $("renamebox"); if (!b) return;
  b.remove(); const r = $("rename");
  if (r) { r.setAttribute("aria-expanded", "false"); if (focus) r.focus(); }
}

/* ---------- needs you ---------- */
function renderNeeds() {
  const n = S.model.needs_you || [];
  if (!n.length) { $("needs").innerHTML = ""; return; }
  const sel = (id, v) => (S.needSel[id] || {})[v] || "";
  const stOpts = (id) => S.model.stations.map(s => `<option value="${esc(s.key)}" ${sel(id, "loc") === s.key ? "selected" : ""}>${esc(s.name)}</option>`).join("");
  const shown = S.needsAll ? n : n.slice(0, 4);
  $("needs").innerHTML = `<section class="frame needs" aria-labelledby="needs-h"><div class="needs-h"><span class="pulse" aria-hidden="true"></span>
    <h3 id="needs-h">${n.length === 1 ? "One thing needs you" : `${n.length} things need you`}</h3><span class="sub">The game log saw these but couldn't tell where they belong.</span></div>` +
    shown.map((x, k) => {
      let ctl = "";
      if (x.kind === "buy") ctl = `<label class="sr" for="nloc-${k}">Station it went to</label><select id="nloc-${k}" class="nloc" data-k="${k}"><option value="">Pick the station</option>${stOpts(x.event_id)}</select>
         <button class="btn sm" type="button" data-act="loc" data-k="${k}">Save station</button>`;
      if (x.kind === "sell") {
        const here = S.model.items.filter(i => i.location_key === x.location_key && i.qty > 0);
        ctl = `<label class="sr" for="nitem-${k}">Which item</label><select id="nitem-${k}" class="nitem" data-k="${k}"><option value="">Pick the item</option>${here.map(i =>
          `<option value="${esc(i.name)}" ${sel(x.event_id, "item") === i.name ? "selected" : ""}>${esc(i.name)} (${fmt(i.qty)})</option>`).join("")}</select>
          <label class="sr" for="nqty-${k}">How many</label><input type="number" class="inp nqty" id="nqty-${k}" data-k="${k}" value="${esc(sel(x.event_id, "qty") || x.qty)}" min="1" style="width:84px">
          <button class="btn sm" type="button" data-act="item" data-k="${k}">Record item</button>`;
      }
      return `<div class="need"><p>${esc(x.text)} <span class="sub">${when(x.ts)}</span></p><div class="ctl">${ctl}
        <button class="btn ghost sm" type="button" data-act="ignore" data-k="${k}">Ignore</button></div></div>`;
    }).join("") + (n.length > 4 ? `<div class="more"><button class="link" type="button" id="needsmore">${S.needsAll ? "Show fewer" : `Show all ${n.length}`}</button></div>` : "") + `</section>`;
  const box = $("needs");
  box.querySelectorAll("select, input").forEach(el => el.onchange = () => {
    const x = n[+el.dataset.k], v = el.classList.contains("nloc") ? "loc" : el.classList.contains("nitem") ? "item" : "qty";
    (S.needSel[x.event_id] ||= {})[v] = el.value;
  });
  if ($("needsmore")) $("needsmore").onclick = () => { S.needsAll = !S.needsAll; renderNeeds(); };
  box.querySelectorAll("button[data-act]").forEach(b => b.onclick = () => {
    const k = b.dataset.k, x = n[+k], act = b.dataset.act;
    if (act === "ignore") return post("/api/event", { event_id: x.event_id, choice: "ignore" });
    if (act === "loc") {
      const v = box.querySelector(`.nloc[data-k="${k}"]`).value;
      if (!v) { box.querySelector(`.nloc[data-k="${k}"]`).focus(); return toast("Pick the station first."); }
      return post("/api/event", { event_id: x.event_id, choice: "location", location_key: v });
    }
    const name = box.querySelector(`.nitem[data-k="${k}"]`).value;
    const qty = box.querySelector(`.nqty[data-k="${k}"]`).value;
    if (!name) { box.querySelector(`.nitem[data-k="${k}"]`).focus(); return toast("Pick the item first."); }
    post("/api/event", { event_id: x.event_id, choice: "item", location_key: x.location_key, name, qty });
  });
}

/* ---------- tabs ---------- */
function renderTabs() {
  const m = S.model, inSt = x => !S.station || x.location_key === S.station;
  const set = (id, n) => { $(id).textContent = n ? fmt(n) : ""; };
  set("c-items", m.items.filter(i => inSt(i) && i.qty > 0).length);
  set("c-changes", m.changes.filter(inSt).length);
  set("c-expired", m.items.filter(i => inSt(i) && i.expired > 0).length);
  set("c-wish", (m.wishlist || []).filter(x => !x.done && x.need > 0).length);
  document.querySelectorAll("#tabs [role=tab]").forEach(b => { const on = b.dataset.tab === S.tab; b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1; });
  $("view").setAttribute("aria-labelledby", "tab-" + S.tab);
  $("filters").hidden = !(S.tab === "items" || S.tab === "expired");
}
function setTab(t, focusTab) {
  if (S.tab === t) return;
  S.tab = t; render();
  const bar = $("tabs"), top = bar.getBoundingClientRect().top + window.scrollY - 2;
  if (window.scrollY > top) window.scrollTo(0, top);
  if (focusTab) $("tab-" + t).focus();
}

/* ---------- items ---------- */
function itemRow(i, k, allSt, showAlso, alt, grouped) {
  const exp = S.tab === "expired", ch = i.log_change + i.your_change;
  const chips = [i.registered ? `<span class="chip reg">Registered</span>` : "",
    i.your_change ? `<span class="chip edit">Edited by you</span>` : "",
    i.expired && !exp ? `<span class="chip exp">${fmt(i.expired)} expired</span>` : "",
    !i.scanned ? `<span class="chip tag">From the log</span>` : "",
    ...(i.tags || []).map(t => `<span class="chip tag">${esc(t)}</span>`)].join("");
  const spec = [i.size && `Size ${i.size}`, i.grade && `Grade ${i.grade}`, i.item_class].filter(Boolean).join(" \u00b7 ");
  const sel = S.open && S.open.key === i.location_key && S.open.name === i.name;
  const also = i.also_at.length ? esc(i.also_at.slice(0, 2).join(", ")) + (i.also_at.length > 2 ? ` +${i.also_at.length - 2}` : "") : "";
  const n = exp ? i.expired : i.qty;
  return `<tr class="row${sel ? " sel" : ""}${alt ? " alt" : ""}" data-i="${k}">
    <td class="c-item"><button type="button" class="iname" data-i="${k}" data-fk="${esc(`item:${i.location_key}|${i.name}`)}">${esc(i.name)}</button>
      <div class="meta">${chips}${i.manufacturer ? `<span class="sub">${esc(i.manufacturer)}</span>` : ""}</div>
      ${allSt && S.sort !== "station" ? `<div class="sub show-md">${esc(i.location)}</div>` : ""}
      ${i.value ? `<div class="show-sm vsm"><b>${fmt(i.value)}</b> <small>aUEC</small></div>` : ""}</td>
    <td class="num c-qty"><span class="qty">${fmt(n)}</span>${ch && !exp ? `<span class="delta ${ch > 0 ? "up" : "down"}" title="Change since the last scan">${signed(ch)}</span>` : ""}</td>
    <td class="num c-val hide-sm">${i.value ? `<span class="val">${fmt(i.value)}<small> aUEC</small></span>${i.unit_sell && n > 1 ? `<span class="each">${fmt(i.unit_sell)} each</span>` : ""}` : `<span class="noval" title="No sell price reported">\u2013</span>`}</td>
    ${allSt && S.sort !== "station" ? `<td class="hide-md c-st">${esc(i.location)}<div class="sub">${esc(i.system || "")}</div></td>` : ""}
    <td class="hide-md">${grouped === "type" ? "" : `${esc(i.item_type || "")}`}<div class="${grouped === "type" ? "" : "sub"}">${esc(spec)}</div></td>
    ${showAlso ? `<td class="hide-md sub">${also}</td>` : ""}</tr>`;
}
function renderItems() {
  const m = S.model, exp = S.tab === "expired";
  if (!m.stations.length) {
    $("fcount").textContent = ""; $("fclear").hidden = true;
    $("view").innerHTML = emptyState("Nothing scanned yet", "Start the tracker (the SC Inventory Tracker shortcut), open a storage kiosk in game and press its Stack button. Your items show up here as the tracker reads them.", `<button class="btn" type="button" data-go="tips">Read the scanning tips</button>`);
    return;
  }
  const rows = filtered(), base = filtered(S.station, true).length, active = filtersActive();
  S.rows = rows;
  $("fcount").textContent = active ? `Showing ${fmt(rows.length)} of ${plural(base, "item")}` : plural(rows.length, "item");
  $("fclear").hidden = !active;
  const intro = exp ? notice("These are locked.", "The kiosk marks them as expired, so you can't take them out as normal. The count shown is the expired ones only.", "rust") : "";
  if (!rows.length) {
    if (!active) { $("view").innerHTML = intro + (exp ? emptyState("Nothing has expired", S.station ? "No items at this station are marked as expired." : "No items at any station are marked as expired.") : emptyState("No items here", "This station has nothing stored right now.")); return; }
    let more = "";
    if (S.station) { const n = filtered("").length; if (n) more = `<button class="btn" type="button" data-allst>Search all stations (${plural(n, "match", "matches")})</button>`; }
    $("view").innerHTML = intro + emptyState("No items match", `Nothing ${S.station ? "at this station " : ""}matches your search and filters. Try fewer letters, or clear them.`, `${more}<button class="btn ghost" type="button" data-clear>Clear search and filters</button>`);
    return;
  }
  const allSt = !S.station, showAlso = m.items.some(i => i.also_at.length);
  const grouped = S.sort === "type" ? "type" : S.sort === "station" && allSt ? "station" : "";
  const th = (key, label, cls = "") => {
    const on = S.sort === key, asc = SORTS[key][1] * S.dir > 0;
    return `<th class="${cls}" ${on ? `aria-sort="${asc ? "ascending" : "descending"}"` : ""}><button type="button" data-sort="${key}">${label}${on ? `<span class="arr" aria-hidden="true">${asc ? "\u25b2" : "\u25bc"}</span>` : ""}</button></th>`;
  };
  const cols = 4 + (allSt && S.sort !== "station" ? 1 : 0) + (showAlso ? 1 : 0);
  const gkey = i => grouped === "type" ? (i.item_type || "Other") : i.location;
  let body = "", cur = null, alt = false;
  rows.forEach((i, k) => {
    if (grouped && gkey(i) !== cur) {
      cur = gkey(i); alt = false;
      const g = rows.filter(r => gkey(r) === cur), val = g.reduce((a, r) => a + (r.value || 0), 0), cnt = g.reduce((a, r) => a + (exp ? r.expired : r.qty), 0);
      body += `<tr class="gh"><th colspan="${cols}" scope="colgroup"><div class="ghbar"><span class="ghn">${esc(cur)}</span><span class="ghm">${plural(g.length, "line")} \u00b7 ${fmt(cnt)} in storage${val ? ` \u00b7 about ${fmt(val)} aUEC` : ""}</span></div></th></tr>`;
    }
    body += itemRow(i, k, allSt, showAlso, alt, grouped); alt = !alt;
  });
  $("view").innerHTML = `${intro}<div class="frame tablewrap"><table class="items"><thead><tr>${th("name", "Item")}${th("qty", exp ? "Expired" : "Qty", "num")}${th("value", "Value", "num hide-sm")}

/* ---------- shared: item search box and "how to get it" ---------- */
function itemSearch(el, onPick, endpoint = "/api/suggest") {
  const box = document.createElement("div"); box.className = "sugg"; box.id = el.id + "-list"; box.setAttribute("role", "listbox"); box.hidden = true; el.after(box);
  el.setAttribute("role", "combobox"); el.setAttribute("aria-autocomplete", "list"); el.setAttribute("aria-expanded", "false"); el.setAttribute("aria-controls", box.id);
  let t = null, rows = [], act = -1, seq = 0;
  const show = (on) => { box.hidden = !on; el.setAttribute("aria-expanded", on); };
  const draw = () => {
    box.innerHTML = rows.map((r, k) => `<div role="option" id="${box.id}-${k}" data-k="${k}" aria-selected="${k === act}"><span>${esc(r.name)}</span>
      <span class="sub">${r.have ? `you have ${fmt(r.have)}` : (r.maker ? esc(r.maker) + (r.role ? ", " + esc(r.role) : "") : "")}</span></div>`).join("");
    if (act >= 0) { el.setAttribute("aria-activedescendant", `${box.id}-${act}`); const o = $(`${box.id}-${act}`); if (o) { const top = o.offsetTop, bot = top + o.offsetHeight; if (top < box.scrollTop) box.scrollTop = top; else if (bot > box.scrollTop + box.clientHeight) box.scrollTop = bot - box.clientHeight; } }
    else el.removeAttribute("aria-activedescendant");
    show(rows.length > 0);
  };
  const pick = (k) => { const r = rows[k]; if (!r) return; el.value = r.name; rows = []; act = -1; draw(); onPick(r); };
  el.addEventListener("input", () => {
    clearTimeout(t);
    const q = el.value.trim();
    if (q.length < 2) { rows = []; act = -1; draw(); return; }
    t = setTimeout(async () => {
      const my = ++seq; let r;
      try { r = await api(`${endpoint}?q=${encodeURIComponent(q)}`); } catch (e) { return; }
      if (my !== seq) return;
      rows = r || []; act = -1; draw();
      if (!rows.length) { box.innerHTML = `<div class="none">No matches for \u201c${esc(q)}\u201d. Try fewer letters or another part of the name.</div>`; show(true); }
    }, 180);
  });
  el.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" && rows.length) { e.preventDefault(); act = (act + 1) % rows.length; draw(); }
    else if (e.key === "ArrowUp" && rows.length) { e.preventDefault(); act = (act - 1 + rows.length) % rows.length; draw(); }
    else if (e.key === "Enter" && rows.length && !box.hidden) { e.preventDefault(); pick(act >= 0 ? act : 0); }
    else if (e.key === "Escape" && !box.hidden) { e.preventDefault(); show(false); }
  });
  box.addEventListener("mousedown", e => e.preventDefault());
  box.addEventListener("click", e => { const o = e.target.closest("[role=option]"); if (o) pick(+o.dataset.k); });
  el.addEventListener("blur", () => setTimeout(() => show(false), 120));
}
function fetchHow(id, name) {
  const k = `${id || ""}|${name}`;
  if (S.howCache[k]) return Promise.resolve(S.howCache[k]);
  return api(`/api/howto?id=${encodeURIComponent(id || "")}&name=${encodeURIComponent(name)}`).then(h => (S.howCache[k] = h));
}
function spotLi(s, key) {
  const age = daysSince(s.date);
  return `<li><span><span class="pl">${esc(s.terminal || s.place)}</span><span class="sub">${esc(s.system || "")}${s.date ? `, reported ${age != null && age > 45 ? `<span class="stale">${Math.round(age)} days ago</span>` : esc(prettyDate(s.date))}` : ""}</span></span>
    <b>${fmt(s[key])} <small>aUEC</small></b></li>`;
}
let moreSeq = 0;
function spotList(list, key) {
  const id = "more" + (++moreSeq), top = list.slice(0, 3), rest = list.slice(3);
  return `<ul class="spots">${top.map(s => spotLi(s, key)).join("")}</ul>${rest.length ? `<ul class="spots" id="${id}" hidden>${rest.map(s => spotLi(s, key)).join("")}</ul>
    <button class="link" type="button" data-more="${id}" aria-expanded="false" aria-controls="${id}" style="margin-top:6px">Show ${rest.length} more</button>` : ""}`;

const route = (t, tag, body, off) => `<section class="route${off ? " off" : ""}"><h4>${t}${tag ? `<span class="rtag">${tag}</span>` : ""}</h4>${body}</section>`;
function howtoHtml(h) {
  const owned = h.owned || [], total = owned.reduce((a, o) => a + o.qty, 0);
  let out = `<div class="how">` + (total
    ? `<p class="havel"><span class="chip reg">You have ${fmt(total)}</span><span>${owned.map(o => `${esc(o.location)} (${fmt(o.qty)})`).join(", ")}</span></p>`
    : `<p class="havel"><span class="chip tag">None stored</span><span class="sub">You don't have any in storage.</span></p>`);
  if (!h.found) return out + `<p class="sub">There's no item data for this one yet, so the tracker can't say where to get it.</p></div>`;
  const spec = [h.type, h.size && `Size ${h.size}`, h.grade && `Grade ${h.grade}`, h.item_class].filter(Boolean).join(" \u00b7 ");
  if (spec) out += `<p class="sub">${esc(spec)}</p>`;
  const R = [], buy = (h.buy || []).slice().sort((a, b) => a.buy - b.buy);
  R.push(buy.length ? route("Buy it", `from ${fmt(buy[0].buy)} aUEC`, `<ul class="spots">${buy.slice(0, 4).map(b => spotLi(b, "buy")).join("")}</ul>${buy.length > 4 ? `<p class="sub">And ${buy.length - 4} more shops.</p>` : ""}`)
    : route("Buy it", "", `<p class="sub">Not sold in any shop players have reported to UEX.</p>`, true));
  if (h.craft) {
    const c = h.craft;
    let b = c.default ? `<p>The blueprint is available from the start.</p>` : c.missions.length
      ? `<p>Get the blueprint from ${c.missions.length === 1 ? "this contract" : "one of these contracts"}:</p><ul class="missions">${c.missions.map(m => `<li>${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a>` : esc(m.title)}
          <span class="chip ${m.chance && m.chance < 1 ? "tag" : "reg"}">${m.chance && m.chance < 1 ? `${Math.round(m.chance * 100)}% chance` : "Guaranteed"}</span></li>`).join("")}</ul>`
      : `<p class="sub">Craftable, but the item data doesn't say where the blueprint comes from.</p>`;
    if (c.ingredients.length) b += `<p class="sub"><b>Needs</b> ${c.ingredients.map(i => `${esc(i.name)}${i.scu ? ` ${i.scu} SCU` : i.qty ? ` x${i.qty}` : ""}`).join(", ")}</p>`;
    if (c.time) b += `<p class="sub"><b>Takes</b> ${esc(c.time)}</p>`;
    R.push(route("Craft it", c.default ? "Blueprint from the start" : c.missions.length ? plural(c.missions.length, "contract") : "", b));
  } else R.push(route("Craft it", "", `<p class="sub">Not craftable, as far as the item data shows.</p>`, true));
  if (h.ships && h.ships.length) R.push(route("Comes fitted on", plural(h.ships.length, "ship"), `<p class="shiplist">${h.ships.slice(0, 12).map(s => `<span class="chip tag">${esc(s)}</span>`).join("")}${h.ships.length > 12 ? `<span class="sub">and ${h.ships.length - 12} more</span>` : ""}</p>
    <p class="sub">Players often get parts like this by looting or salvaging those ships, or by taking them off one they own.</p>`));
  if (h.loot) R.push(route("Loot", "", `<p>Can turn up as loot.</p>`));
  if (h.events && h.events.length) R.push(route("Events", "", `<p>${h.events.map(e => esc(e.name || e)).join(", ")}</p>`));
  out += `<div class="routes">${R.join("")}</div>`;
  const sell = (h.sell || []).slice().sort((a, b) => b.sell - a.sell);
  if (sell.length) out += `<p class="sub">Sells for up to <b>${fmt(sell[0].sell)} aUEC</b> at ${esc(sell[0].terminal || sell[0].place)}.</p>`;
  if (h.url) out += `<p class="sub"><a href="${esc(h.url)}" target="_blank" rel="noopener">More on star-citizen.wiki ${ICON.ext}</a></p>`;
  return out + `</div>`;
}

         ${c.adjustment_id ? `<button class="link" type="button" data-undo="${c.adjustment_id}">Undo</button>` : `<span class="chip log">Game log</span>`}</li>`).join("")}</ul></div>` : ""}
      ${sell.length ? `<div class="blk"><h3>Best places to sell <span>price each</span></h3>${spotList(sell, "sell")}</div>` : ""}
      ${buy.length ? `<div class="blk"><h3>Cheapest places to buy <span>price each</span></h3>${spotList(buy, "buy")}</div>` : ""}
      <div class="blk"><h3>Your note and tags</h3><p class="sub" style="margin:0">Shared by every stack of this item, at every station.</p>
        <div class="form"><div class="field" style="flex:1 1 100%"><label for="nt">Note</label><textarea id="nt" placeholder="e.g. keep for the Centaurus refit">${esc(i.note)}</textarea></div>
          <div class="field grow"><label for="tg">Tags, separated by commas</label><input id="tg" placeholder="keep, sell, mission" value="${esc((i.tags || []).join(", "))}"></div>
          <button class="btn ghost" type="button" id="ntgo">Save note and tags</button></div></div>
      ${stats.length ? `<div class="blk"><h3>Stats</h3><dl class="kv">${stats.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div>` : ""}
      ${cmp}
      ${det.length ? `<details class="blk det"><summary>More details</summary><dl class="kv">${det.map(([k, v]) => `<dt>${k}</dt><dd>${k === "Item id" ? v : esc(v)}</dd>`).join("")}</dl></details>` : ""}
      ${i.wiki_url ? `<div class="blk"><a href="${esc(i.wiki_url)}" target="_blank" rel="noopener">More on star-citizen.wiki ${ICON.ext}</a></div>` : ""}
    </div>`;
}
function openItem(i, fk, quiet) {
  if (!i) return;
  S.open = { key: i.location_key, name: i.name };
  if (fk) S.opener = fk;
  const d = $("drawer"), keep = d.scrollTop;
  d.innerHTML = drawerHtml(i);
  d.classList.add("open"); d.removeAttribute("inert");
  $("shell").classList.add("has-panel"); updateModal();
  document.querySelectorAll("#view tr.row").forEach(tr => { const r = S.rows[+tr.dataset.i]; tr.classList.toggle("sel", !!r && r.location_key === i.location_key && r.name === i.name); });
  $("dclose").onclick = () => closeItem();
  let dir = -1;
  const def = "The next scan of this station replaces it with the kiosk's own count.";
  const delta = () => { const raw = $("adq").value.trim(), n = parseInt(raw, 10); if (!n) return 0; return /^[+-]/.test(raw) ? n : dir * Math.abs(n); };
  const prev = () => {
    const dl = delta(), p = $("adprev");
    if (!dl) { p.textContent = def; return; }
    const nt = i.qty + dl;
    p.innerHTML = nt < 0 ? `<span class="warnt">That's more than the ${fmt(i.qty)} recorded here.</span> Check the number, or rescan this station.` : `New total here: <b>${fmt(nt)}</b>. ${def}`;
  };
  d.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => { dir = +b.dataset.dir; d.querySelectorAll("[data-dir]").forEach(x => x.setAttribute("aria-pressed", x === b)); prev(); });
  $("adq").oninput = prev;
  const go = async () => {
    const q = delta();
    if (!q) { $("adq").focus(); return toast("Enter how many, e.g. 40."); }
    if (await post("/api/adjust", { location_key: i.location_key, name: i.name, id: i.id, delta: q, note: $("adn").value })) reopen();
  };
  $("adgo").onclick = go;
  [$("adq"), $("adn")].forEach(el => el.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); go(); } });
  $("ntgo").onclick = async () => {
    if (await post("/api/note", { name: i.name, note: $("nt").value, tags: $("tg").value.split(",").map(t => t.trim()).filter(Boolean) })) reopen();
  };
  d.querySelectorAll("[data-undo]").forEach(b => b.onclick = async () => { if (await post("/api/undo", { adjustment_id: +b.dataset.undo })) reopen(); });
  d.querySelectorAll("[data-also]").forEach(b => b.onclick = () => {
    const st = S.model.stations.find(s => s.name === b.dataset.also); if (!st) return;
    const it = S.model.items.find(x => x.location_key === st.key && x.name === i.name);
    S.station = st.key; closeRename(false); render(); if (it) openItem(it, `item:${it.location_key}|${it.name}`);
  });
  bindMore(d);
  if (quiet) d.scrollTop = keep; else { d.scrollTop = 0; $("dtitle").focus(); }
}
function reopen() {
  if (!S.open) return;
  const i = S.model.items.find(x => x.location_key === S.open.key && x.name === S.open.name);
  if (i) openItem(i); else closeItem();
}
function refreshOpen() {
  const i = S.model.items.find(x => x.location_key === S.open.key && x.name === S.open.name);
  if (i) openItem(i, null, true);
}
function closeItem(focus = true) {
  if (!S.open) return;
  S.open = null;
  const d = $("drawer"); d.classList.remove("open"); d.setAttribute("inert", "");
  $("shell").classList.remove("has-panel"); updateModal();
  document.querySelectorAll("#view tr.row.sel").forEach(tr => tr.classList.remove("sel"));
  if (focus && S.opener) { const el = document.querySelector(`[data-fk="${CSS.escape(S.opener)}"]`); if (el) el.focus(); }
}
function updateModal() {
  const overlay = !!S.open && !dockMQ.matches, d = $("drawer");
  document.querySelector(".rail").inert = overlay; $("main").inert = overlay;
  $("scrim").classList.toggle("show", overlay);
  if (overlay) { d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true"); }
  else { d.setAttribute("role", "complementary"); d.removeAttribute("aria-modal"); }
}

/* ---------- wiring ---------- */
function render(auto) {
  if (!S.model) return;
  const ae = document.activeElement, fk = ae && ae.dataset ? ae.dataset.fk : null;
  renderRail(); fillTypes(); renderHead(); renderNeeds(); renderTabs();
  const t = S.tab;
  if (!(auto && ["wish", "ships", "settings", "tips", "links", "about"].includes(t))) {
    const tok = ++S.viewTok;
    const fail = e => { if (tok === S.viewTok) $("view").innerHTML = emptyState("Couldn't load this tab", `${esc(problem(e))}`, `<button class="btn ghost" type="button" data-retry>Try again</button>`); };
    try {
      if (t === "items" || t === "expired") renderItems();
      else if (t === "changes") renderChanges();
      else if (t === "wish") renderWish();
      else {
        const f = { tips: renderTips, ships: renderShips, links: renderLinks, about: renderAbout, settings: renderSettings }[t];
        if (f) f(tok).catch(fail);
      }
    } catch (e) { fail(e); }
  }
  if (fk) { const el = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }
}
$("rail").addEventListener("click", e => {
  const b = e.target.closest(".st"); if (!b) return;
  S.station = b.dataset.st; closeRename(false); closeItem(false); render();
});
$("tabs").addEventListener("click", e => { const b = e.target.closest("[role=tab]"); if (b) setTab(b.dataset.tab); });
$("tabs").addEventListener("keydown", e => {
  const tabs = [...$("tabs").querySelectorAll("[role=tab]")], i = tabs.indexOf(document.activeElement); if (i < 0) return;
  const n = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i - 1 + tabs.length) % tabs.length, Home: 0, End: tabs.length - 1 }[e.key];
  if (n != null) { e.preventDefault(); setTab(tabs[n].dataset.tab, true); tabs[n].focus(); }
});
$("view").addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return setTab(g.dataset.go);
  if (e.target.closest("[data-retry]")) return render();
  if (e.target.closest("[data-clear]")) { clearFilters(); $("q").focus(); return; }
  if (e.target.closest("[data-allst]")) { S.station = ""; render(); return; }
  const so = e.target.closest("[data-sort]");
  if (so) { const k = so.dataset.sort; if (S.sort === k) S.dir *= -1; else { S.sort = k; S.dir = 1; } $("fsort").value = k; render(); const b = $("view").querySelector(`[data-sort="${k}"]`); if (b) b.focus(); return; }
  const un = e.target.closest("[data-undo]"); if (un) return post("/api/undo", { adjustment_id: +un.dataset.undo });
  const co = e.target.closest("[data-chopen]");
  if (co) { const c = S.chRows[+co.dataset.chopen], it = S.model.items.find(i => i.location_key === c.location_key && i.name === c.item); if (it) { co.dataset.fk = `chg:${co.dataset.chopen}`; openItem(it, co.dataset.fk); } return; }
  const row = e.target.closest("tr.row");
  if (row && (!e.target.closest("button, a, input") || e.target.closest(".iname"))) { const it = S.rows[+row.dataset.i]; openItem(it, `item:${it.location_key}|${it.name}`); }
});
["ftype", "fchanged", "freg", "fspread", "fammo"].forEach(id => $(id).addEventListener("input", () => render()));
$("fsort").addEventListener("input", () => { S.sort = $("fsort").value; S.dir = 1; render(); });
$("fclear").onclick = () => { clearFilters(); $("q").focus(); };
$("q").addEventListener("input", () => { $("qclear").hidden = !$("q").value; if (S.tab !== "items" && S.tab !== "expired") S.tab = "items"; render(); });
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { const b = $("view").querySelector(".iname"); if (b && S.rows.length === 1) b.click(); } });
$("qclear").onclick = () => { $("q").value = ""; $("qclear").hidden = true; render(); $("q").focus(); };
$("scrim").onclick = () => closeItem();
dockMQ.addEventListener("change", updateModal);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !e.defaultPrevented) {
    const rb = $("renamebox");
    if (rb && rb.contains(document.activeElement)) return closeRename();
    if (S.open) return closeItem();
    if (rb) return closeRename();
    if (document.activeElement === $("q") && $("q").value) { $("q").value = ""; $("qclear").hidden = true; render(); }
  }
  if (e.key === "Tab" && S.open && !dockMQ.matches) {
    const f = [...$("drawer").querySelectorAll("button, a[href], input, textarea, select, summary, [tabindex='0']")].filter(x => !x.disabled && x.offsetParent !== null);
    if (f.length) { const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
  }
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey && !isTyping()) { e.preventDefault(); if (S.open && !dockMQ.matches) closeItem(false); $("q").focus(); $("q").select(); }
});
document.addEventListener("focusin", e => { S.editing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.target.id !== "q"; });
document.addEventListener("focusout", () => setTimeout(() => { if (!isTyping()) S.editing = false; }, 0));
if ($("ver").textContent.startsWith("__")) api("/api/about").then(a => { S.about = a; $("ver").textContent = a.version; }).catch(() => $("ver").textContent = "");
load();
setInterval(() => { if (!S.editing && !document.hidden) load(true); }, 15000);
</script>
</body>
</html>
